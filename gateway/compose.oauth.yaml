# The OAuth profile for a hosted MCP client (SAW-036).
#
# Optional, and additive: an operator who connects Hermes or their own agent with
# MCP_TOKEN never needs this file. Add it to the public stack when a hosted
# client — Claude's custom connectors are the one this was written for — has to
# authorize a person rather than carry a shared token:
#
#   docker compose -f compose.yaml -f compose.public.yaml -f compose.oauth.yaml up -d --build
#
# It needs the public overlay: the authorization flow runs over HTTPS on a real
# domain, and a token that travelled over plain HTTP is a token somebody else has.
#
# Nothing here is an authorization server. That is a product you already run or
# sign up for, and the sidecar only ever reads its public keys: it issues no
# token, registers no client, and shows no consent screen. What it does with the
# token that arrives is check that your authorization server made it, that it was
# made for this deployment, and that it has not expired — and then serve MCP.
# docs/integrations/claude.md is the whole setup, including what the
# authorization server must support before any of this works.
#
# What this changes: /mcp on the public name takes an access token instead of
# MCP_TOKEN, and the sidecar publishes the discovery document that tells a client
# where to get one. MCP_TOKEN still opens the stack's own private endpoint on the
# namespace's loopback address, which is what the healthcheck and the `agent`
# profile use and what nothing outside can reach.

services:
  sidecar:
    environment:
      # The authorization server, exactly as its tokens spell `iss` — a trailing
      # slash included, if it publishes one. Setting it is what turns OAuth on.
      MCP_OAUTH_ISSUER: ${MCP_OAUTH_ISSUER:?set MCP_OAUTH_ISSUER in gateway/.env - your authorization server's issuer URL, for example https://auth.example.com/realms/seeker}
      # The audience a token must carry. Empty means https://$GATEWAY_DOMAIN/mcp,
      # which is this deployment's canonical MCP URI and the right answer unless
      # your authorization server insists on naming the audience differently.
      MCP_OAUTH_RESOURCE: ${MCP_OAUTH_RESOURCE:-}
      # Where the public keys are. Empty means the sidecar reads the issuer's own
      # metadata document and takes jwks_uri from it.
      MCP_OAUTH_JWKS_URL: ${MCP_OAUTH_JWKS_URL:-}
      # Scopes a token must carry, separated by spaces. Empty accepts any scope
      # the authorization server issued for this resource.
      MCP_OAUTH_SCOPE: ${MCP_OAUTH_SCOPE:-}
