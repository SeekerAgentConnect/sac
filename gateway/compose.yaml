# Self-hosting stack for the sidecar (SAW-034, SAW-035).
#
# Run it from this directory:
#   cp .env.example .env    # then fill in the two tokens
#   docker compose up -d --build
#
# That is the local-development configuration: plain HTTP, published on the
# host's loopback address. The internet-facing one is this file plus an overlay,
# which terminates TLS for a domain you own:
#
#   docker compose -f compose.yaml -f compose.public.yaml up -d --build
#
# Everything builds from this checkout. No image or package that has not been
# published is required, and nothing is pulled from a registry but the two
# upstream base images.
#
# What starts: the sidecar and the gateway. That is all. Starting the stack
# creates no wallet request, moves no funds, and launches no LLM — the sidecar
# waits for an agent to call it, and the test agent does not run at all unless
# it is asked for by name (see the `agent` profile at the bottom).

name: seeker-agent-wallet

services:
  # The sidecar owns the network namespace the gateway joins, so it is declared
  # first and carries the published port.
  sidecar:
    build:
      # The repository root: the pnpm workspace's lockfile and catalog resolve
      # the package's dependencies, so the context has to contain them.
      context: ..
      dockerfile: sidecar/Dockerfile
    image: seeker-agent-wallet/sidecar:local
    restart: unless-stopped

    # The one published port is the gateway's listener, which lives in this
    # namespace. The sidecar's own 8080 binds 127.0.0.1 inside the namespace and
    # is therefore unreachable from the host and from every other container; it
    # is deliberately not mapped here.
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8080}:8081"

    environment:
      # Stage 1's invariant, unchanged by containerizing: the sidecar listens on
      # loopback and is reached through the gateway.
      SIDECAR_HOST: 127.0.0.1
      SIDECAR_PORT: 8080
      MCP_TOKEN: ${MCP_TOKEN:?set MCP_TOKEN in gateway/.env - see .env.example}
      PHONE_TOKEN: ${PHONE_TOKEN:?set PHONE_TOKEN in gateway/.env - see .env.example}
      LIVE_COMMAND_TIMEOUT_SECONDS: ${LIVE_COMMAND_TIMEOUT_SECONDS:-60}
      # The public hostname agents and the phone use. Without it only loopback
      # Host headers are accepted, which is right for a laptop and wrong for a VPS.
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      MCP_DEMO_TOOLS: ${MCP_DEMO_TOOLS:-false}
      SIDECAR_PUBLIC_URL: ${SIDECAR_PUBLIC_URL:-}
      DATABASE_PATH: /data/sidecar.db
      REQUEST_TTL_SECONDS: ${REQUEST_TTL_SECONDS:-}
      REQUEST_PENDING_LIMIT: ${REQUEST_PENDING_LIMIT:-}
      PAIRING_TOKEN_TTL_SECONDS: ${PAIRING_TOKEN_TTL_SECONDS:-}
      # Empty means the sidecar serves no transfer tool and prepares nothing.
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      SOLANA_RPC_TIMEOUT_MS: ${SOLANA_RPC_TIMEOUT_MS:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}

    volumes:
      # Durable requests, pairing credentials, and the server ID. This is the only
      # state that must outlive a container, and the only writable path in the image.
      - sidecar-data:/data

    healthcheck:
      # GET /healthz is unauthenticated and answers on the sidecar's own listener,
      # so this proves the sidecar is up rather than the gateway in front of it.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # main.ts handles SIGTERM: it cancels the in-flight live command, ends the
    # streams, stops listening, and closes SQLite. Node is PID 1 in the image, so
    # it receives the signal directly. The grace period is long enough for an
    # in-flight response to finish first.
    stop_grace_period: 30s
    stop_signal: SIGTERM

    # The sidecar holds no key and signs nothing; it needs no capability either.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    # The namespace share is what lets the sidecar keep its loopback bind while
    # still being reachable by something. It also means the gateway has no route
    # to the sidecar that anything else could take.
    network_mode: "service:sidecar"
    depends_on:
      sidecar:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - gateway-data:/data
      - gateway-config:/config
    healthcheck:
      # Through the listener and out the other side: a pass means the published
      # port really reaches the sidecar, which validating the config would not show.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Not started by `docker compose up`. The profile is what keeps it out: a
  # service in a profile runs only when that profile is named, so no ordinary
  # start of this stack can create a request or reach a wallet.
  #
  #   docker compose run --rm test-agent tools
  #   docker compose run --rm test-agent address
  #
  # `tools` and `address` only read. `ack`, `sign`, and `transfer` create a
  # request the owner then sees on their phone — deliberate acts, never startup.
  test-agent:
    profiles: ["agent"]
    build:
      context: ..
      dockerfile: test-agent/Dockerfile
    image: seeker-agent-wallet/test-agent:local
    # Same namespace, so it reaches the gateway the way an external agent does,
    # rather than bypassing it on the sidecar's loopback port.
    network_mode: "service:sidecar"
    depends_on:
      sidecar:
        condition: service_healthy
    environment:
      MCP_URL: ${AGENT_MCP_URL:-http://127.0.0.1:8081/mcp}
      MCP_TOKEN: ${MCP_TOKEN:?set MCP_TOKEN in gateway/.env - see .env.example}
      LIVE_COMMAND_TIMEOUT_SECONDS: ${LIVE_COMMAND_TIMEOUT_SECONDS:-60}
      # The stack's own development switch, which also gates the CLI's two
      # diagnostics: `hello` and `ack` return an acknowledgement, and an
      # acknowledgement is neither a signature nor a payment. Off by default,
      # and `--demo` runs one anyway.
      MCP_DEMO_TOOLS: ${MCP_DEMO_TOOLS:-false}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  sidecar-data:
  gateway-data:
  gateway-config:
