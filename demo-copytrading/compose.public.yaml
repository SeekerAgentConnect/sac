# Internet-facing overlay for compose.yaml (SEE-95).
#
# The base file on its own is the local stack: plain HTTP on the host's loopback
# address. This overlay is what puts the template's API on the internet, and it is
# a deliberate, separate command rather than a default:
#
#   docker compose -f compose.yaml -f compose.public.yaml up -d --build
#
# Before the first start, the domain in PUBLISHER_DOMAIN must already resolve to
# this host (an A record, an AAAA record, or both), and ports 80 and 443 must be
# reachable from the internet. Caddy answers the certificate authority's
# challenge on port 80 and serves HTTPS on 443; it then renews on its own.
#
# **Run this only if something off this machine has to write signals.** What goes
# public here is a write API whose token is the whole grant to publish as this
# server — that is a different thing from the shared gateway's public read port,
# where everything served is a document somebody published for everyone. A
# template whose signals are written locally, or by a process beside it, is
# better off on the base file and reached over a tunnel.
#
# What changes compared with the base file: the proxy serves Caddyfile.public
# instead of Caddyfile, and 80 and 443 are published on every interface.

services:
  copytrading:
    # The template still binds loopback inside the namespace and is still
    # unpublished. These are the proxy's ports: it shares this namespace.
    ports:
      - "80:80"
      - "443:443"

  proxy:
    environment:
      PUBLISHER_DOMAIN: ${PUBLISHER_DOMAIN:?set PUBLISHER_DOMAIN in demo-copytrading/.env - the public domain name, for example signals.example.com}
      # Where the certificate authority sends expiry and problem notices.
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in demo-copytrading/.env - the address your certificate authority should contact}
    volumes:
      # Replaces the development Caddyfile mounted by the base file.
      - ./Caddyfile.public:/etc/caddy/Caddyfile:ro
