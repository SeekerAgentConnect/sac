# Push-relay overlay for compose.yaml (SEE-92).
#
# The base stack streams to phones that are being looked at. This overlay adds
# the other half: one content-free hint per changed feed, through Firebase, so a
# phone in a pocket learns that something moved and reads it from the gateway.
# It is a separate command rather than a default, for the same reason the public
# overlay is — and for one more: it mounts a credential.
#
#   docker compose -f compose.yaml -f compose.push.yaml up -d --build
#
# Composable with the public overlay, in this order:
#
#   docker compose -f compose.yaml -f compose.public.yaml -f compose.push.yaml \
#     up -d --build
#
# What it needs, in feed-gateway/.env:
#
#   BROADCAST_PUSH_CREDENTIALS_FILE=/etc/seeker/service-account.json
#   BROADCAST_PUSH_ENVIRONMENT=production
#
# The file is a Firebase service account for the project whose app the phones
# are running (docs/guides/firebase.md). Keep it outside this checkout, readable
# by the Docker daemon's user and nobody else, and do not paste its contents
# into .env: a path is configuration, and what the path points at is a
# credential.
#
# It is mounted into the gateway and into nothing else. The broker never sees
# it, Redis never sees it, the operator's `ctl` never sees it, and a publisher
# certainly never sees it — a publisher publishes to the gateway, and the
# gateway is what holds this. That is the whole reason the relay is here rather
# than in a publisher's own deployment.

services:
  feed-gateway:
    environment:
      # Where the credential is inside the container. Setting it is what turns
      # the relay on; the mount below is where it comes from.
      BROADCAST_PUSH_CREDENTIALS: /run/secrets/push-credentials.json
      # The push API. It is named rather than compiled in, so this deployment
      # can be pointed at something of its own — and so that there is no
      # hostname in the gateway's source at all.
      BROADCAST_PUSH_ENDPOINT: ${BROADCAST_PUSH_ENDPOINT:-https://fcm.googleapis.com}
      # Which topics this deployment sends on: production or sandbox. It scopes
      # every topic name, so one Firebase project can serve both kinds of
      # deployment without a sandbox publication waking a production subscriber.
      BROADCAST_PUSH_ENVIRONMENT: ${BROADCAST_PUSH_ENVIRONMENT:?set BROADCAST_PUSH_ENVIRONMENT in feed-gateway/.env to production or sandbox}
    volumes:
      # Read-only, and the only thing in this deployment that is mounted from
      # outside it apart from the two configuration files.
      #
      # The long form, for `create_host_path: false`: the short one would create
      # a *directory* where a missing credential file was named, and the gateway
      # would then refuse to start over something that looks like a typo. This
      # way the missing file is the error.
      - type: bind
        source: ${BROADCAST_PUSH_CREDENTIALS_FILE:?set BROADCAST_PUSH_CREDENTIALS_FILE in feed-gateway/.env - the path of the Firebase service account file on this host}
        target: /run/secrets/push-credentials.json
        read_only: true
        bind:
          create_host_path: false
