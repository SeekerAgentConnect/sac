version: v2
clean: true
# The vendored broker schema keeps its own Java package (`centrifugal.centrifugo.unistream`) rather
# than being renamed into ours. It is not ours, and one file in the app is allowed to import it: a
# name that says whose it is makes that boundary readable in every import line, and an Android test
# pins it (feeds/FeedBoundaryTest.kt).
managed:
  enabled: true
  override:
    - file_option: java_package
      value: centrifugal.centrifugo.unistream
plugins:
  # Kotlin only, and into a directory of its own. The sidecar and the feed gateway are never
  # compiled against a client protocol neither of them speaks — the gateway publishes over the
  # broker's server API, and the sidecar has nothing to do with feeds at all. Same argument as
  # buf.gen.yaml's exclusion of publish.proto: a boundary that needs no test to hold.
  - remote: buf.build/protocolbuffers/java:v36.1
    out: android/app/src/main/generated/centrifugo/java
    opt: lite
  - remote: buf.build/protocolbuffers/kotlin:v36.1
    out: android/app/src/main/generated/centrifugo/kotlin
    opt: lite
  - remote: buf.build/connectrpc/kotlin:v0.9.0
    out: android/app/src/main/generated/centrifugo/kotlin
# Vendored, pinned and checksummed: third_party/centrifugo/README.md says which release this is and
# why the file is here rather than fetched. It is deliberately outside buf.yaml's workspace, so
# `buf format` and `buf lint` never rewrite or judge someone else's schema.
inputs:
  - directory: third_party/centrifugo
