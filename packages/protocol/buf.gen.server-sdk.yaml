version: v2
clean: true
# Direct wire contracts owned and packaged by @seekeragentconnect/server-sdk. Public-feed and publisher
# contracts are deliberately absent from this npm artifact.
plugins:
  - local: protoc-gen-es
    out: packages/server-sdk/src/gen
    opt:
      - target=js+dts
      - import_extension=js
inputs:
  - directory: packages/protocol/proto
    paths:
      - packages/protocol/proto/seekervault/live/v1
      - packages/protocol/proto/seekervault/request/v1
      - packages/protocol/proto/seekervault/server/v1
      - packages/protocol/proto/seekervault/update/v1
