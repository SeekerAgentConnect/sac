syntax = "proto3";

// How a publisher publishes (SEE-90, docs/wiki/feed-gateway.md).
//
// A developer's server uses this authenticated API to publish feed documents. A public feed's
// publisher maintains no connection to any phone and learns nothing about who is subscribed. A
// restricted feed's publisher (SEE-156) decides which devices may read and tells the gateway here,
// with the same credential and only for its own channel: the gateway enforces what it is told and
// never learns why — no wallet, no person, only opaque references a publisher chose.
//
// It is authenticated, and the credential is the whole of the grant: it says which server the
// caller publishes as, and every document is checked against that rather than against anything the
// document claims. There is no field here for a channel on a cancellation and no field anywhere
// for a server other than the caller's own.
//
// The publisher service is called only by backends. Generating the message types for another
// runtime grants no role.
//
// Retrying is the ordinary case, not an exception: a template that lost its answer, was restarted,
// or ran twice publishes the same revision again and is told it was unchanged. The contract's own
// revision is the idempotency key — a publisher's promise about its content — so there is no
// second key to mint, store or expire.
package seekervault.gateway.v1;

import "seekervault/proposal/v1/proposal.proto";
import "seekervault/request/v2/request.proto";
import "seekervault/server/v1/manifest.proto";

// PublisherService is the write API, served on its own listener with its own credential. A
// deployment can publish the read port to the internet and keep this one on a private address, and
// the Caddy configuration in services/gateway/ routes them separately by default.
service PublisherService {
  // Register or replace what this server says about itself. The manifest must name this gateway's
  // own origin and be a feed on the caller's own channel. A direct manifest carries a URL, and the
  // gateway refuses to relay one.
  rpc PublishManifest(PublishManifestRequest) returns (PublishManifestResponse);
  // Create or update one request through the common developer contract. A feed request must use
  // the caller's own channel and device-local result handling. PublishProposal remains below as a
  // wire-compatible adapter for publishers built before the common contract.
  rpc PublishRequest(PublishRequestRequest) returns (PublishRequestResponse);
  rpc CancelRequest(CancelRequestRequest) returns (CancelRequestResponse);
  // Create or update one proposal. The document is the publisher's whole current statement about
  // it — the gateway stores what it validated and never merges a partial one.
  rpc PublishProposal(PublishProposalRequest) returns (PublishProposalResponse);
  // Withdraw one. It takes an ID and a revision rather than a document, because a publisher that
  // has to cancel may no longer hold what it published — and because the gateway is then the only
  // thing that writes the transition, in one place, from one state.
  rpc CancelProposal(CancelProposalRequest) returns (CancelProposalResponse);
  // Say that this publisher's server is running (SEE-150). The gateway never contacts a
  // publisher's server, so this is how a phone can be told a feed is online rather than only that
  // the gateway is: every authenticated call here counts as a check-in, and a publisher with
  // nothing to publish calls this on the interval the answer names. A publisher that stops calling
  // is shown offline once the gateway's presence window passes.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // What access policy the gateway enforces for the caller's feed (SEE-156). A restricted
  // publisher asks before it publishes anything, and publishes nothing unless the answer is
  // restricted: a gateway too old to know the method, or one that registered the feed as public,
  // must never be handed a restricted feed's documents to serve to anyone.
  rpc DescribeAccess(DescribeAccessRequest) returns (DescribeAccessResponse);
  // Grant one approved device access to the caller's own restricted channel, or renew a grant it
  // already holds (SEE-156). Idempotent: the same grant again extends it to the lifetime asked for,
  // within the gateway's bound. A revoked grant is never renewed, and a grant another publisher
  // holds is never touched.
  rpc GrantAccess(GrantAccessRequest) returns (GrantAccessResponse);
  // Revoke grants on the caller's own channel (SEE-156). Final: a revoked grant's session is
  // refused from then on — reads, pages, tickets, renewals and push — and the channel's stream
  // name moves, so a listener already attached stops receiving anything on the one it holds.
  // Revoking a grant that is already revoked is answered as done; one the caller does not hold is
  // refused and changes nothing.
  rpc RevokeAccess(RevokeAccessRequest) returns (RevokeAccessResponse);
}

// What became of a publication. Both answers mean the gateway holds what the caller sent; they
// differ in whether anything changed, which is what a retry needs to know.
enum PublishStatus {
  PUBLISH_STATUS_UNSPECIFIED = 0;
  // The document is new, or its content moved to a higher revision. Subscribers are notified.
  PUBLISH_STATUS_STORED = 1;
  // The gateway already held exactly this, at this revision. Nothing was written and nothing was
  // notified: a retry is not an event.
  PUBLISH_STATUS_UNCHANGED = 2;
}

message PublishManifestRequest {
  seekervault.server.v1.ServerManifest manifest = 1;
}

message PublishManifestResponse {
  PublishStatus status = 1;
  // The revision the gateway now holds, which is the one that was sent.
  uint64 settings_revision = 2;
  // The access the gateway stamped on the manifest it holds (SEE-156). Absent from a gateway that
  // predates restricted feeds, which a restricted publisher reads as "this gateway will not
  // enforce me" and stops.
  seekervault.server.v1.FeedAccess access = 3;
}

message PublishRequestRequest {
  seekervault.request.v2.Request request = 1;
}

message PublishRequestResponse {
  PublishStatus status = 1;
  uint64 revision = 2;
  uint64 snapshot_sequence = 3;
}

message CancelRequestRequest {
  string request_id = 1;
  uint64 revision = 2;
}

message CancelRequestResponse {
  PublishStatus status = 1;
  seekervault.request.v2.Request request = 2;
  uint64 snapshot_sequence = 3;
}

message PublishProposalRequest {
  seekervault.proposal.v1.Proposal proposal = 1;
}

message PublishProposalResponse {
  PublishStatus status = 1;
  uint64 revision = 2;
  // The channel's sequence after this publication: the same counter a reader sees as a snapshot
  // boundary, so a publisher can tell a subscriber's snapshot apart from the one it just created.
  uint64 snapshot_sequence = 3;
}

message CancelProposalRequest {
  string proposal_id = 1;
  // The revision this withdrawal is published at, which must be above the one the gateway holds.
  // Revisions stay the publisher's to choose, including this one: the gateway never invents a
  // number that a subscriber would then order other documents against.
  uint64 revision = 2;
}

message CancelProposalResponse {
  PublishStatus status = 1;
  // The document as the gateway now holds it, so the publisher can see exactly what subscribers
  // will read — including the update time, which is the one field in a proposal the gateway ever
  // writes, because the withdrawal happened here.
  seekervault.proposal.v1.Proposal proposal = 2;
  uint64 snapshot_sequence = 3;
}

// Nothing to say but that the caller is running; the credential says who it is.
message HeartbeatRequest {}

message HeartbeatResponse {
  // How often, at most, the gateway expects a check-in. A publisher that goes three intervals
  // without any authenticated call is shown offline.
  uint32 interval_seconds = 1;
}

message DescribeAccessRequest {}

message DescribeAccessResponse {
  // The policy and authentication origin the operator registered for the caller's feed.
  seekervault.server.v1.FeedAccess access = 1;
  // The longest a grant may run without renewal: the bound on how long a device keeps access when
  // its publisher cannot reach the gateway to revoke it.
  uint32 most_grant_seconds = 2;
}

message GrantAccessRequest {
  // The grant's identity, a lowercase UUID the publisher minted. It is what a revocation names.
  string grant_id = 1;
  // An opaque, publisher-scoped reference to whoever the publisher approved, 1 to 64 printable
  // ASCII characters. The gateway stores it, never interprets it, and never learns what it stands
  // for; it exists so a publisher can recognise its own grants in the operator's view.
  string subscriber_ref = 2;
  // An opaque reference to the approved device, under the same rules.
  string device_ref = 3;
  // SHA-256 of the session the publisher handed the device: the gateway never holds the session
  // itself, so its database cannot be replayed as access.
  bytes session_digest = 4;
  // How long this grant runs before it must be renewed, at most DescribeAccessResponse's bound.
  uint32 lifetime_seconds = 5;
}

message GrantAccessResponse {
  // How long the grant now runs, which may be less than was asked.
  uint32 lifetime_seconds = 1;
}

message RevokeAccessRequest {
  // The grants to revoke, 1 to 64, all on the caller's channel.
  repeated string grant_ids = 1;
}

message RevokeAccessResponse {
  // How many of them this call revoked; the rest were already revoked.
  uint32 revoked = 1;
}
