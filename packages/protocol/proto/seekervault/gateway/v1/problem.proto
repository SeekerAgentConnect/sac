syntax = "proto3";

// Why the feed gateway refused something (SEE-90, docs/wiki/feed-gateway.md).
//
// The gateway is the shared service a developer's publisher publishes to and every subscribed
// phone reads from. It has two audiences and one vocabulary for saying no: a publisher that broke
// a rule about its own document, and a client that asked for something that isn't there. This file
// is that vocabulary, and it is the detail on every error either of them sees — the same shape
// seekervault.request.v1.RequestErrorDetail is on the sidecar's.
//
// A code is a rule, not a hint about what exists. In particular there is exactly one code for a
// credential problem: a caller learns that it was not authenticated, and never whether the
// credential it presented is unknown, revoked, or for another publisher.
package seekervault.gateway.v1;

// One rule, and the one that stopped the call. The gateway checks in a fixed order and answers
// with the first problem it finds, so the same call always fails the same way.
enum GatewayProblem {
  // Never sent.
  GATEWAY_PROBLEM_UNSPECIFIED = 0;

  // --- Who is calling -------------------------------------------------------
  // No credential, or one this gateway does not accept. One code on purpose: the answer says
  // nothing about which of those it was.
  GATEWAY_PROBLEM_UNAUTHENTICATED = 1;
  // The document names a server other than the one the caller publishes as. A publisher's grant is
  // its own server, and nothing here widens it.
  GATEWAY_PROBLEM_OTHER_SERVER = 2;
  // The document names a channel its server does not own. A channel is "server/<server_id>" for
  // the document's own server, so this is a publisher claiming another publisher's audience.
  GATEWAY_PROBLEM_FOREIGN_CHANNEL = 3;

  // --- What the document says -----------------------------------------------
  // A server or proposal ID that is not a lowercase UUID.
  GATEWAY_PROBLEM_BAD_ID = 4;
  // A revision of zero, or one this gateway could not order (see the store's own limit). A
  // revision is the publisher's promise about its content, so an unorderable one is refused
  // rather than stored as something the gateway cannot compare later.
  GATEWAY_PROBLEM_BAD_REVISION = 5;
  // The manifest's mode is not a gateway feed. A direct manifest carries a URL, and this gateway
  // will not relay one: a document read here must never be able to point a phone at a server of
  // the publisher's choosing.
  GATEWAY_PROBLEM_NOT_A_FEED = 6;
  // The manifest names another gateway's origin. A phone compares that origin with the reference
  // it added the feed from, so a mismatch here is a document no phone could use.
  GATEWAY_PROBLEM_OTHER_GATEWAY = 7;
  // A phone-server contract version this gateway does not serve.
  GATEWAY_PROBLEM_OTHER_PROTOCOL = 8;
  // A plugin requirement that isn't a well-formed plugin ID, or a contract range that isn't one.
  GATEWAY_PROBLEM_BAD_PLUGIN = 9;
  // The same plugin required twice, which says two things about one name.
  GATEWAY_PROBLEM_DUPLICATE_PLUGIN = 10;
  // More required plugins than one manifest may name.
  GATEWAY_PROBLEM_TOO_MANY_PLUGINS = 11;
  // No environment, a repeated one, or an unspecified one. A server that names no environment
  // says nothing a phone can act on (SEE-97).
  GATEWAY_PROBLEM_BAD_ENVIRONMENT = 12;
  // A display name that is too long, or not printable text.
  GATEWAY_PROBLEM_BAD_NAME = 13;
  // An operation that isn't an operation name at the protocol's own level.
  GATEWAY_PROBLEM_BAD_OPERATION = 14;
  // No explicit proposal status. A missing one is never read as open.
  GATEWAY_PROBLEM_NO_STATUS = 15;
  // A missing, unorderable or contradictory time: no expiry, an expiry at or before creation, an
  // update before creation, or a creation time that moved after the proposal already existed.
  GATEWAY_PROBLEM_BAD_TIMES = 16;
  // A publisher note that is too long, or not printable text.
  GATEWAY_PROBLEM_BAD_NOTE = 17;
  // A term whose key isn't a short lowercase name, or whose text is too long or unprintable.
  GATEWAY_PROBLEM_BAD_VALUE = 18;
  // The same key twice. The list is how a plugin finds one term, so a repeat has no meaning.
  GATEWAY_PROBLEM_DUPLICATE_VALUE = 19;
  // More terms than one proposal may carry.
  GATEWAY_PROBLEM_TOO_MANY_VALUES = 20;

  // --- What is already here -------------------------------------------------
  // A revision below the one the gateway holds. A retry that arrives late must not restore terms
  // the publisher has moved past.
  GATEWAY_PROBLEM_STALE_REVISION = 21;
  // The revision the gateway holds, arriving with different content. A revision is a promise about
  // content: the same one twice is a retry, and the same one with something else is a
  // contradiction the gateway refuses rather than resolving.
  GATEWAY_PROBLEM_REVISION_CONFLICT = 22;
  // A publication for a proposal that was cancelled. A withdrawal is final: a publisher with
  // something else to propose publishes another proposal, which is another identity.
  GATEWAY_PROBLEM_CANCELLED = 23;
  // A publication whose status is cancelled. Withdrawing is a transition, and CancelProposal is
  // where it happens, so there is one way to make it and one place that checks it.
  GATEWAY_PROBLEM_CANCEL_ON_PUBLISH = 24;
  // The channel already holds as many proposals as the gateway keeps for one. Nothing is evicted
  // to make room: a publisher's own bound is theirs to stay inside.
  GATEWAY_PROBLEM_TOO_MANY_PROPOSALS = 25;

  // --- What was asked for ---------------------------------------------------
  // No such server, or one that has published no manifest yet.
  GATEWAY_PROBLEM_NO_SUCH_SERVER = 26;
  // No such proposal on that channel — never published, or no longer kept (see retention).
  GATEWAY_PROBLEM_NO_SUCH_PROPOSAL = 27;
  // A page token this gateway did not write, or one for another channel. Tokens are opaque, and a
  // client that builds one instead of echoing it gets this.
  GATEWAY_PROBLEM_BAD_CURSOR = 28;
  // A page size outside the range the gateway serves.
  GATEWAY_PROBLEM_BAD_PAGE_SIZE = 29;

  // --- How much is being asked ---------------------------------------------
  // The caller is over its rate. It says nothing about the call itself, so the same one can be
  // made again later.
  GATEWAY_PROBLEM_TOO_MANY_REQUESTS = 30;

  // --- Listening (SEE-91) ---------------------------------------------------
  // This gateway serves no stream: it holds the documents and answers reads, and nothing is
  // configured to fan them out. A client gets this once and reads unary from then on, which is the
  // whole feature working at a smaller size rather than a failure.
  GATEWAY_PROBLEM_NO_STREAM = 31;
  // More channels in one ticket than the gateway grants at once. The message carries the bound, so
  // a client can ask again for fewer rather than guess.
  GATEWAY_PROBLEM_TOO_MANY_CHANNELS = 32;

  // --- Hints (SEE-92) -------------------------------------------------------
  // This gateway relays nothing: it holds the documents, answers reads, and has no push credential
  // of its own. A client gets this once and keeps to the foreground stream and its own recovery,
  // which is again the whole feature working at a smaller size rather than a failure.
  GATEWAY_PROBLEM_NO_PUSH = 33;

  // --- What is already here, continued (SEE-97) -----------------------------
  // A manifest whose environments are not the ones this server published before. It belongs with
  // the "what is already here" codes above and is numbered here instead because a number is the
  // wire and only the last one is free.
  //
  // An environment is what a server promises when the owner approves, and a promise that can be
  // raised by publishing a higher revision is not one: every subscribed phone would be moved from
  // a demonstration to real money by a document. A second environment is a second deployment,
  // with its own server ID, credential and database — which is what the publisher's own database
  // stamp already enforces at its end.
  GATEWAY_PROBLEM_OTHER_ENVIRONMENT = 34;

  // Retired gateway-private problems (SEE-130). Never reuse: old logs, stored status and clients
  // may still carry these values while the corresponding routes remain permanently unavailable.
  reserved 35 to 46;
  reserved "GATEWAY_PROBLEM_BAD_USER_REF", "GATEWAY_PROBLEM_BAD_LIFETIME", "GATEWAY_PROBLEM_INVALID_INVITATION", "GATEWAY_PROBLEM_INVITATION_EXPIRED", "GATEWAY_PROBLEM_INVITATION_USED", "GATEWAY_PROBLEM_NO_BINDING", "GATEWAY_PROBLEM_BINDING_EXISTS", "GATEWAY_PROBLEM_WRONG_RECIPIENT", "GATEWAY_PROBLEM_NO_SUCH_REQUEST", "GATEWAY_PROBLEM_RESULT_CONFLICT", "GATEWAY_PROBLEM_REQUEST_SETTLED", "GATEWAY_PROBLEM_NOT_PRIVATE";

  // --- Restricted feeds (SEE-156) -------------------------------------------
  // Numbered after the retired range above, which stays retired: none of these reuses a number or
  // a meaning that range carried (docs/wiki/restricted-feeds.md).
  //
  // The channel is restricted and the call carried no session, or one this gateway does not hold
  // for that channel. One code for both, so a caller learns nothing about sessions it does not
  // hold; the phone answers it by asking the publisher for access, never by reading anonymously.
  GATEWAY_PROBLEM_ACCESS_REQUIRED = 47;
  // The session was granted for this channel and the publisher revoked it. Final: the same
  // session will never be accepted again, and only a new approval can grant another.
  GATEWAY_PROBLEM_ACCESS_REVOKED = 48;
  // The session's grant ran out without being renewed — the bound on how long access outlives a
  // publisher the gateway cannot hear from. Not final: a publisher that still approves the device
  // renews the same grant, and the session works again.
  GATEWAY_PROBLEM_ACCESS_EXPIRED = 49;
  // A publisher's manifest claims an access policy or authentication origin other than the one
  // its operator registered. A restricted feed cannot be published as public by omission, and a
  // public one cannot point phones at an origin nobody registered.
  GATEWAY_PROBLEM_ACCESS_MISMATCH = 50;
  // A grant call from a publisher whose feed is not restricted. Access to a public feed is not a
  // thing this gateway records.
  GATEWAY_PROBLEM_NOT_RESTRICTED = 51;
  // A grant the caller does not hold: never granted, or granted by another publisher. One code
  // for both, so a publisher cannot probe another publisher's grants — and a cross-publisher
  // revocation changes nothing.
  GATEWAY_PROBLEM_NO_SUCH_GRANT = 52;
  // A renewal of a grant this gateway already revoked. A revocation is final at the gateway, so a
  // late or replayed renewal can never bring access back.
  GATEWAY_PROBLEM_GRANT_REVOKED = 53;
  // A grant whose identity, references, session digest or lifetime is not well formed.
  GATEWAY_PROBLEM_BAD_GRANT = 54;
}

// GatewayErrorDetail is the Connect error detail on every FeedService and PublisherService error.
message GatewayErrorDetail {
  GatewayProblem problem = 1;
  // The field or term key the rule was about, when it was about one. Never a value: a message that
  // echoed what it refused would put a publisher's mistake in the caller's logs.
  string field = 2;
  // What the gateway holds, for a stale revision and a revision conflict. A publisher that lost
  // its own state — a template that was redeployed, say — needs one number to catch up with, and
  // it is a number every subscriber can already read.
  uint64 held_revision = 3;
}
