# Seeker Agent Connect: a Hermes MCP server entry for the sidecar's tools.
#
# Merge the `seeker_vault` entry into the `mcp_servers` section of your existing
# ~/.hermes/config.yaml. Don't replace that file. Keep the token out of this file: put it in
# ~/.hermes/.env as
#
#   MCP_SEEKER_VAULT_API_KEY=<the MCP_TOKEN value from the sidecar's .env>
#
# Setup, checks, and the VPS variant: docs/integrations/hermes.md
#
# This is the local entry. For a deployment reached over its own domain, use
# examples/hermes.config.hosted.yaml instead: same entry, HTTPS URL, and a
# shorter tool list, because a public gateway does not carry the Stage 1
# diagnostic (docs/integrations/hermes.md#9-hermes-against-the-packaged-stack).
mcp_servers:
  seeker_vault:
    # The sidecar's MCP endpoint. For Hermes on a VPS, use the VPS end of the SSH tunnel
    # instead, for example http://127.0.0.1:18080/mcp. The Stage 7 stack publishes its
    # gateway on this same address and port by default, so this line fits it unchanged.
    url: "http://127.0.0.1:8080/mcp"
    headers:
      # Hermes fills in ${...} from ~/.hermes/.env or the environment. An unset variable is
      # sent as the literal text, and the sidecar answers 401.
      Authorization: "Bearer ${MCP_SEEKER_VAULT_API_KEY}"
    # Seconds Hermes waits for a tool call. Only vault_display_command waits for the owner, so
    # keep this above the sidecar's LIVE_COMMAND_TIMEOUT_SECONDS (60 in .env.example), so its
    # TIMEOUT answer arrives first, and below Hermes's fixed 300-second HTTP read limit. The
    # durable tools answer at once.
    timeout: 90
    tools:
      # Each tool is allowed on purpose:
      # - vault_display_command: the Stage 1 live diagnostic. It waits for the owner's OK.
      # - vault_get_address: reads the wallet the owner connected on their phone, and its
      #   network. Read-only, and it never invents an address.
      # - vault_get_capabilities: says what this sidecar serves, and that approval is manual.
      #   Read-only, and it never fails.
      # - vault_sign_message: asks the owner's wallet to sign a message, and returns its
      #   request_id at once. Nothing is signed until the owner approves it on the phone.
      # - vault_transfer: asks the owner's wallet to send SOL or a classic SPL token, and returns
      #   its request_id at once. Nothing is built, signed, or sent until the owner approves it on
      #   the phone; the sidecar serves it only when its .env has a SOLANA_RPC_URL.
      # - vault_request_ack: queues an acknowledgement and returns its request_id at once. A demo
      #   tool with no wallet involved: the sidecar serves it only with MCP_DEMO_TOOLS=true.
      # - vault_get_request: reads a request's status later, by its request_id.
      # - vault_cancel_request: withdraws a request the owner hasn't answered.
      include:
        [
          vault_display_command,
          vault_get_address,
          vault_get_capabilities,
          vault_sign_message,
          vault_transfer,
          vault_request_ack,
          vault_get_request,
          vault_cancel_request,
        ]
      resources: false
      prompts: false
