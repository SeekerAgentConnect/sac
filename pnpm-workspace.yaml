# Node workspace members, by the component layout in docs/development/monorepo-layout.md.
packages:
  - packages/server-sdk
  - servers/mcp-server
  - servers/mcp-skr-staking
  - tools/test-agent

# The postinstall only locates the platform binary that pnpm already installs as an
# optional dependency; bin/buf finds it without running the script.
# bufferutil and utf-8-validate are ws's optional native accelerators, pulled in by
# @solana/web3.js. The sidecar opens no websocket, and ws works without them, so their
# native builds stay off.
# @firebase/util's postinstall reads FIREBASE_WEBAPP_CONFIG, can contact a Firebase endpoint, and
# writes generated defaults into its package. The sidecar uses Firebase Admin with runtime ADC,
# not that web-app path, so the install must stay deterministic and credential-independent.
# protobufjs's postinstall only checks and warns about dependency version syntax; no build output
# depends on it.
allowBuilds:
  "@bufbuild/buf": false
  "@firebase/util": false
  bufferutil: false
  protobufjs: false
  utf-8-validate: false

catalog:
  # The protoc-gen-es generator and the @bufbuild/protobuf runtime move in lockstep.
  "@bufbuild/protobuf": 2.14.1
  "@bufbuild/protoc-gen-es": 2.14.1
  # The sidecar and the test agent speak MCP through the same SDK and zod.
  "@modelcontextprotocol/sdk": 1.30.0
  "@types/node": 24.13.4
  typescript: 6.0.3
  zod: 4.6.1
