name: seeker-agent-connect-mcp

services:
  mcp-server:
    build:
      context: ../..
      dockerfile: servers/mcp-server/Dockerfile
    image: ${MCP_SERVER_IMAGE:-seeker-agent-connect/mcp-server:local}
    restart: unless-stopped
    environment:
      SIDECAR_HOST: 0.0.0.0
      SIDECAR_PORT: 8080
      SIDECAR_PUBLIC_URL: ${SIDECAR_PUBLIC_URL:-http://127.0.0.1:8080}
      MCP_SERVER_DATA_DIR: /data
      DATABASE_PATH: ${DATABASE_PATH:-/data/sidecar.db}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_TOKEN: ${MCP_TOKEN:-}
      PHONE_TOKEN: ${PHONE_TOKEN:?set PHONE_TOKEN in deploy/mcp/.env}
      LIVE_COMMAND_TIMEOUT_SECONDS: ${LIVE_COMMAND_TIMEOUT_SECONDS:-30}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      MCP_DEMO_TOOLS: ${MCP_DEMO_TOOLS:-false}
      REQUEST_TTL_SECONDS: ${REQUEST_TTL_SECONDS:-}
      REQUEST_PENDING_LIMIT: ${REQUEST_PENDING_LIMIT:-}
      PAIRING_TOKEN_TTL_SECONDS: ${PAIRING_TOKEN_TTL_SECONDS:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      SOLANA_RPC_TIMEOUT_MS: ${SOLANA_RPC_TIMEOUT_MS:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      SIDECAR_HEALTH_CA_CERT_PATH: ${SIDECAR_HEALTH_CA_CERT_PATH:-}
      MCP_OAUTH_ISSUER: ${MCP_OAUTH_ISSUER:-}
      MCP_OAUTH_RESOURCE: ${MCP_OAUTH_RESOURCE:-}
      MCP_OAUTH_JWKS_URL: ${MCP_OAUTH_JWKS_URL:-}
      MCP_OAUTH_SCOPE: ${MCP_OAUTH_SCOPE:-}
    ports:
      - "${MCP_SERVER_BIND:-127.0.0.1}:${MCP_SERVER_PORT:-8080}:8080"
    networks:
      - direct-ingress
      - egress
    volumes:
      - mcp-data:/data
    stop_grace_period: 30s
    stop_signal: SIGTERM
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  direct-ingress:
    name: ${DIRECT_INGRESS_NETWORK:-seeker-direct-ingress}
    internal: true
  egress:

volumes:
  mcp-data:
    name: ${MCP_VOLUME_NAME:-seeker-agent-connect-mcp_mcp-data}
