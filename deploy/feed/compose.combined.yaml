# Combined-host overlay: the feed project owns one internal publication network that independently
# managed demo projects may join. It is separate from the ingress network and its trusted-proxy
# range; publishers receive no read-side proxy authority.
services:
  feed-gateway:
    networks:
      feed-ingress:
      feed-private:
      feed-publish:
      egress:

networks:
  feed-publish:
    name: ${FEED_PUBLISH_NETWORK:-seeker-feed-publish}
    internal: true
