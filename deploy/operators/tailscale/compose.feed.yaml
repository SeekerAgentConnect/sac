name: seeker-feed-tailscale

services:
  feed-ingress:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      FEED_DOMAIN: ${FEED_DOMAIN:?set FEED_DOMAIN in deploy/operators/tailscale/.env}
    ports:
      - "${TAILSCALE_HTTPS_BIND:-127.0.0.1:9443}:443"
    networks:
      - feed-ingress
      - public
    volumes:
      - ./Caddyfile.feed:/etc/caddy/Caddyfile:ro
      - type: bind
        source: ${TAILSCALE_TLS_DIR:?set TAILSCALE_TLS_DIR to the absolute certificate directory}
        target: /run/tls
        read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]

networks:
  feed-ingress:
    external: true
    name: ${FEED_INGRESS_NETWORK:-seeker-feed-ingress}
  public:
