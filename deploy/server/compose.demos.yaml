# Optional Stage 7.1 demo publishers (SEE-106) and the CopyTrading trader UI
# (SEE-126).
#
# Always combine this with compose.yaml. The five named runtime services can be
# started or replaced with --no-deps, leaving the infrastructure untouched:
#   docker compose -f compose.yaml -f compose.demos.yaml up -d --no-deps \
#     copytrading copytrading-proxy copytrading-admin \
#     prediction prediction-proxy
# Recreate copytrading, copytrading-proxy and copytrading-admin together.

name: seeker-agent-wallet-server

services:
  copytrading:
    build:
      context: ../..
      dockerfile: publisher/Dockerfile
    image: ${PUBLISHER_IMAGE:-seeker-publisher/copytrading:local}
    restart: unless-stopped
    env_file:
      - ${COPYTRADING_ENV_FILE:-.env.copytrading}
    environment:
      # The manifest carries the public URL from the env file. Publications use
      # this Docker-only route; `broadcast` is never leaked to a phone.
      PUBLISHER_PUBLISH_URL: http://broadcast:8082
      PUBLISHER_API_ADDRESS: 127.0.0.1:8092
      PUBLISHER_DATABASE_PATH: /data/copytrading.db
      # Optional global create cap (SEE-126). 0 / unset is unlimited; the demo
      # sets a rolling-hour ceiling so the public trader UI cannot fill the store.
      PUBLISHER_CREATE_LIMIT: ${COPYTRADING_CREATE_LIMIT:-200}
    ports:
      # Caddy owns 8093 inside the shared namespace. Only host loopback can call
      # the authenticated control API from outside this Compose project.
      - "127.0.0.1:${COPYTRADING_PORT:-8092}:8093"
    networks:
      - publisher-ingress
    volumes:
      - copytrading-data:/data
      - type: bind
        source: ${COPYTRADING_SECRETS_DIR:-./secrets/copytrading}
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    stop_grace_period: 20s
    stop_signal: SIGTERM
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  copytrading-proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    network_mode: "service:copytrading"
    depends_on:
      - copytrading
    volumes:
      - ./Caddyfile.copytrading:/etc/caddy/Caddyfile:ro
      - copytrading-caddy-data:/data
      - copytrading-caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8093/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s
    cap_drop:
      - ALL
    # Caddy's file capability; see gateway-proxy in compose.yaml.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  copytrading-ctl:
    profiles: ["operator"]
    build:
      context: ../..
      dockerfile: publisher/Dockerfile
    image: ${PUBLISHER_IMAGE:-seeker-publisher/copytrading:local}
    entrypoint: ["/publishctl"]
    network_mode: "service:copytrading"
    environment:
      PUBLISHER_API_URL: http://127.0.0.1:8093
      # Pass PUBLISHER_API_TOKEN just for `docker compose run`; the runtime
      # service itself reads it from its mounted file.
      PUBLISHER_API_TOKEN: ${COPYTRADING_API_TOKEN:-}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Password-gated HTML UI for judges (SEE-126). Shares copytrading's network
  # namespace so it can call the loopback API; the gateway Caddy reaches it as
  # copytrading:8096 on publisher-ingress. No host port, and /v1 stays off the
  # public origin.
  copytrading-admin:
    build:
      context: ../..
      dockerfile: publisher/Dockerfile
    image: ${PUBLISHER_IMAGE:-seeker-publisher/copytrading:local}
    entrypoint: ["/copytrading-admin"]
    restart: unless-stopped
    network_mode: "service:copytrading"
    depends_on:
      - copytrading
      - copytrading-proxy
    environment:
      ADMIN_LISTEN_ADDRESS: 0.0.0.0:8096
      ADMIN_PUBLIC_PATH: /trader
      ADMIN_API_URL: http://127.0.0.1:8092
      PUBLISHER_API_TOKEN_FILE: /run/secrets/api-token
      ADMIN_PASSWORDS_FILE: /run/secrets/admin-passwords
      ADMIN_SESSION_SECRET_FILE: /run/secrets/admin-session-secret
    volumes:
      - type: bind
        source: ${COPYTRADING_SECRETS_DIR:-./secrets/copytrading}
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    stop_grace_period: 15s
    stop_signal: SIGTERM
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Hash helper. No network namespace: minting a password does not need the API
  # and must work before copytrading is up.
  copytrading-pass:
    profiles: ["operator"]
    build:
      context: ../..
      dockerfile: publisher/Dockerfile
    image: ${PUBLISHER_IMAGE:-seeker-publisher/copytrading:local}
    entrypoint: ["/copytrading-admin"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  prediction:
    build:
      context: ../..
      dockerfile: publisher/Dockerfile
    image: ${PUBLISHER_IMAGE:-seeker-publisher/copytrading:local}
    entrypoint: ["/prediction"]
    restart: unless-stopped
    env_file:
      - ${PREDICTION_ENV_FILE:-.env.prediction}
    environment:
      PUBLISHER_PUBLISH_URL: http://broadcast:8082
      PUBLISHER_API_ADDRESS: 127.0.0.1:8092
      PUBLISHER_DATABASE_PATH: /data/prediction.db
    ports:
      - "127.0.0.1:${PREDICTION_PORT:-8094}:8095"
    networks:
      - publisher-ingress
    volumes:
      - prediction-data:/data
      - type: bind
        source: ${PREDICTION_SECRETS_DIR:-./secrets/prediction}
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    stop_grace_period: 20s
    stop_signal: SIGTERM
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  prediction-proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    network_mode: "service:prediction"
    depends_on:
      - prediction
    volumes:
      - ./Caddyfile.prediction:/etc/caddy/Caddyfile:ro
      - prediction-caddy-data:/data
      - prediction-caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8095/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s
    cap_drop:
      - ALL
    # Caddy's file capability; see gateway-proxy in compose.yaml.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  prediction-ctl:
    profiles: ["operator"]
    build:
      context: ../..
      dockerfile: publisher/Dockerfile
    image: ${PUBLISHER_IMAGE:-seeker-publisher/copytrading:local}
    entrypoint: ["/publishctl"]
    network_mode: "service:prediction"
    environment:
      PUBLISHER_API_URL: http://127.0.0.1:8095
      PUBLISHER_API_TOKEN: ${PREDICTION_API_TOKEN:-}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  copytrading-data:
  copytrading-caddy-data:
  copytrading-caddy-config:
  prediction-data:
  prediction-caddy-data:
  prediction-caddy-config:
