# Part 1 behind Tailscale Funnel instead of a DNS name of the operator's own.
#
# Add after compose.yaml (and before compose.demos.yaml when the demos run):
#   docker compose -f compose.yaml -f compose.tailscale.yaml up -d --build
#
# BROADCAST_DOMAIN is the node's MagicDNS name, and .env moves Caddy's host
# bindings to loopback (GATEWAY_HTTPS_BIND=127.0.0.1:9443), where
#   tailscale funnel --bg --tcp=443 tcp://localhost:9443
# reaches it. The forward is raw TCP: TLS and HTTP/2 end in Caddy, so the
# Centrifugo stream works exactly as it does behind a public 443.

name: seeker-agent-wallet-server

services:
  broadcast:
    environment:
      # Funnel offers 443, 8443 and 10000. When 443 on the node already serves
      # something else, GATEWAY_PUBLIC_PORT names the one the forward uses; the
      # gateway drops a default :443 from its origin itself. Caddy's listener
      # inside the container stays 443 and matches the name, whatever the port.
      BROADCAST_PUBLIC_URL: https://${BROADCAST_DOMAIN:?set BROADCAST_DOMAIN in deploy/server/.env}:${GATEWAY_PUBLIC_PORT:-443}

  gateway-proxy:
    volumes:
      - ./Caddyfile.tailscale:/etc/caddy/Caddyfile:ro
      # One certificate for the node's one name, shared with the optional
      # sidecar. tls-from-tailscale.sh leaves the key to uid 10001 and group
      # root (0640) when BROADCAST_DOMAIN is that name: Caddy here is root with
      # no capability, so the group bit is the only way it can read the file.
      - ./tls:/run/tls:ro
