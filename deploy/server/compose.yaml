# Stage 7.1 app infrastructure on one Linux server (SEE-106).
#
# Run from deploy/server after copying .env.template to .env:
#   mkdir -p secrets/broadcast
#   docker compose up -d --build
#
# This base file deliberately contains neither demo publisher nor the private
# sidecar. Add compose.demos.yaml or compose.direct.yaml only when that part is
# wanted. All files keep the original deploy/server project name so the existing
# sidecar-data volume is reused rather than replaced during an upgrade.

name: seeker-agent-wallet-server

services:
  broadcast:
    build:
      context: ../..
      dockerfile: broadcast/Dockerfile
    image: ${BROADCAST_IMAGE:-seeker-broadcast/gateway:local}
    restart: unless-stopped

    # Caddy shares this network namespace. These are Caddy's public ports; the
    # gateway itself remains on three loopback sockets in the namespace. The
    # defaults are the public pair; compose.tailscale.yaml's layout moves them
    # to host loopback in .env, because Funnel is then the public listener.
    ports:
      - "${GATEWAY_HTTP_BIND:-80}:80"
      - "${GATEWAY_HTTPS_BIND:-443}:443"

    environment:
      # The one origin phones learn and manifests must repeat exactly. Container
      # names belong only in PUBLISHER_PUBLISH_URL, never here.
      BROADCAST_PUBLIC_URL: https://${BROADCAST_DOMAIN:?set BROADCAST_DOMAIN in deploy/server/.env}
      BROADCAST_READ_ADDRESS: 127.0.0.1:8090
      BROADCAST_PUBLISHER_ADDRESS: 127.0.0.1:8091
      BROADCAST_DATABASE_PATH: /data/broadcast.db
      BROADCAST_RETENTION_HOURS: ${BROADCAST_RETENTION_HOURS:-}
      BROADCAST_MAX_PROPOSALS: ${BROADCAST_MAX_PROPOSALS:-}
      BROADCAST_READ_RATE: ${BROADCAST_READ_RATE:-}
      BROADCAST_READ_BURST: ${BROADCAST_READ_BURST:-}
      BROADCAST_PUBLISH_RATE: ${BROADCAST_PUBLISH_RATE:-}
      BROADCAST_PUBLISH_BURST: ${BROADCAST_PUBLISH_BURST:-}

      # Streaming is part of this deployment, not an optional unary-only mode.
      BROADCAST_STREAM_URL: http://centrifugo:8000
      BROADCAST_STREAM_API_KEY: ${CENTRIFUGO_API_KEY:?set CENTRIFUGO_API_KEY in deploy/server/.env}
      BROADCAST_STREAM_TOKEN_KEY: ${CENTRIFUGO_TOKEN_KEY:?set CENTRIFUGO_TOKEN_KEY in deploy/server/.env}
      BROADCAST_TICKET_MINUTES: ${BROADCAST_TICKET_MINUTES:-}
      BROADCAST_MAX_CHANNELS: ${BROADCAST_MAX_CHANNELS:-}

      # Empty keeps the Firebase relay off. To turn it on, set the fixed path
      # below in .env and put the key in secrets/broadcast. The read-only mount
      # exists only on this gateway service; demos never receive it.
      BROADCAST_PUSH_CREDENTIALS: ${BROADCAST_PUSH_CREDENTIALS:-}
      BROADCAST_PUSH_ENDPOINT: ${BROADCAST_PUSH_ENDPOINT:-}
      BROADCAST_PUSH_ENVIRONMENT: ${BROADCAST_PUSH_ENVIRONMENT:-}
      BROADCAST_PUSH_RATE: ${BROADCAST_PUSH_RATE:-}
      BROADCAST_PUSH_BURST: ${BROADCAST_PUSH_BURST:-}

    networks:
      - broadcast-inside
      - publisher-ingress
    depends_on:
      centrifugo:
        condition: service_healthy
    volumes:
      - broadcast-data:/data
      - type: bind
        source: ./secrets/broadcast
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    stop_grace_period: 30s
    stop_signal: SIGTERM
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  gateway-proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    network_mode: "service:broadcast"
    depends_on:
      - broadcast
    environment:
      BROADCAST_DOMAIN: ${BROADCAST_DOMAIN:?set BROADCAST_DOMAIN in deploy/server/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/server/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - gateway-caddy-data:/data
      - gateway-caddy-config:/config
    healthcheck:
      # The private loopback endpoint crosses Caddy and the gateway without
      # exposing an operator health surface on the host.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s
    cap_drop:
      - ALL
    # The official Caddy binary carries the file capability cap_net_bind_service.
    # With it outside the bounding set the kernel refuses to exec the file at all
    # ("operation not permitted"), for root too, so it is the one capability kept.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  centrifugo:
    image: centrifugo/centrifugo:v6.9.6
    restart: unless-stopped
    command: ["centrifugo", "-c", "/etc/centrifugo/centrifugo.yaml"]
    environment:
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:?set CENTRIFUGO_API_KEY in deploy/server/.env}
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_KEY:?set CENTRIFUGO_TOKEN_KEY in deploy/server/.env}
      CENTRIFUGO_ENGINE_REDIS_ADDRESS: redis://redis:6379
    volumes:
      # The pinned, tested broker configuration from the implementation, through
      # a symlink to broadcast/centrifugo.yaml: one file in a checkout, and a real
      # copy in a folder made with `rsync -L` for a server that only pulls images.
      - ./centrifugo.yaml:/etc/centrifugo/centrifugo.yaml:ro
    networks:
      - broadcast-inside
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    stop_grace_period: 35s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAX_MEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    networks:
      - broadcast-inside
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 2s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Local operator access to the gateway database. A profile keeps it out of
  # `up`; `docker compose run --rm gateway-ctl ...` is the only entry point.
  gateway-ctl:
    profiles: ["operator"]
    build:
      context: ../..
      dockerfile: broadcast/Dockerfile
    image: ${BROADCAST_IMAGE:-seeker-broadcast/gateway:local}
    entrypoint: ["/broadcastctl"]
    environment:
      BROADCAST_DATABASE_PATH: /data/broadcast.db
    volumes:
      - broadcast-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  # Redis and the broker have no egress and no route from the host.
  broadcast-inside:
    internal: true
  # The demos attach here. It supplies egress for ACME, Firebase and Prediction,
  # but no service port on it is published except Caddy's explicit 80/443 pair.
  # Port 8082 therefore stays single-host and container-only.
  publisher-ingress:

volumes:
  broadcast-data:
  gateway-caddy-data:
  gateway-caddy-config:
