# Optional private direct sidecar/MCP service (Stage 7, preserved by SEE-106).
#
# This is intentionally not routed through the broadcast gateway. Its own TLS
# listener remains on host loopback for a raw TCP/Tailscale Funnel forward, so
# pairing, private requests and UpdateService keep their original HTTP/2 path.

name: seeker-agent-wallet-server

services:
  sidecar:
    image: ${SIDECAR_IMAGE:-docker.io/brenat/seeker-agent-connect:sidecar-v1}
    restart: unless-stopped
    network_mode: host
    env_file:
      - ${DIRECT_ENV_FILE:-.env.direct}
    environment:
      SIDECAR_HOST: 127.0.0.1
      SIDECAR_TLS_CERT_PATH: /run/tls/fullchain.pem
      SIDECAR_TLS_KEY_PATH: /run/tls/privkey.pem
      DATABASE_PATH: /data/sidecar.db
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/fcm-service-account.json
    volumes:
      # This key and project name are unchanged from the original deployment,
      # so existing pairing identity, requests and credentials stay in place.
      - sidecar-data:/data
      - ./tls:/run/tls:ro
      - type: bind
        source: ./secrets/sidecar
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "process.env.NODE_TLS_REJECT_UNAUTHORIZED='0';fetch('https://127.0.0.1:'+(process.env.SIDECAR_PORT||'8443')+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s
    stop_signal: SIGTERM
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  sidecar-data:
