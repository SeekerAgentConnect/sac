name: seeker-prediction

services:
  prediction:
    build:
      context: ../..
      dockerfile: examples/demo-prediction/Dockerfile
    image: ${PREDICTION_IMAGE:-seeker-prediction/prediction:local}
    restart: unless-stopped
    environment:
      PUBLISHER_SERVER_ID: ${PUBLISHER_SERVER_ID:?set PUBLISHER_SERVER_ID in deploy/prediction/.env}
      PUBLISHER_GATEWAY_URL: ${PUBLISHER_GATEWAY_URL:?set PUBLISHER_GATEWAY_URL in deploy/prediction/.env}
      PUBLISHER_PUBLISH_URL: ${PUBLISHER_PUBLISH_URL:?set PUBLISHER_PUBLISH_URL in deploy/prediction/.env}
      PUBLISHER_ENVIRONMENT: ${PUBLISHER_ENVIRONMENT:-sandbox}
      PUBLISHER_DISPLAY_NAME: ${PUBLISHER_DISPLAY_NAME:-Prediction}
      BROADCAST_CREDENTIAL: ${BROADCAST_CREDENTIAL:?set BROADCAST_CREDENTIAL in deploy/prediction/.env}
      PUBLISHER_API_TOKEN: ${PUBLISHER_API_TOKEN:?set PUBLISHER_API_TOKEN in deploy/prediction/.env}
      PUBLISHER_API_ADDRESS: 0.0.0.0:8092
      PUBLISHER_DATABASE_PATH: ${PUBLISHER_DATABASE_PATH:-/data/prediction.db}
      PUBLISHER_PUBLISH_TIMEOUT_SECONDS: ${PUBLISHER_PUBLISH_TIMEOUT_SECONDS:-}
      PREDICTION_PROVIDER_URL: ${PREDICTION_PROVIDER_URL:-}
      PREDICTION_API_KEY: ${PREDICTION_API_KEY:-}
      PREDICTION_PROVIDER_TIMEOUT_SECONDS: ${PREDICTION_PROVIDER_TIMEOUT_SECONDS:-}
      PREDICTION_CALL_GAP_MS: ${PREDICTION_CALL_GAP_MS:-}
      PREDICTION_SOURCE: ${PREDICTION_SOURCE:-}
      PREDICTION_CATEGORIES: ${PREDICTION_CATEGORIES:-}
      PREDICTION_FILTER: ${PREDICTION_FILTER:-}
      PREDICTION_POLL_SECONDS: ${PREDICTION_POLL_SECONDS:-}
      PREDICTION_KEYWORDS: ${PREDICTION_KEYWORDS:-}
      PREDICTION_TAGS: ${PREDICTION_TAGS:-}
      PREDICTION_STATE: ${PREDICTION_STATE:-}
      PREDICTION_LEAST_CLOSE_IN_MINUTES: ${PREDICTION_LEAST_CLOSE_IN_MINUTES:-}
      PREDICTION_MOST_CLOSE_IN_MINUTES: ${PREDICTION_MOST_CLOSE_IN_MINUTES:-}
      PREDICTION_LIFETIME_HOURS: ${PREDICTION_LIFETIME_HOURS:-}
      PREDICTION_PAGE_SIZE: ${PREDICTION_PAGE_SIZE:-}
      PREDICTION_MOST_PAGES: ${PREDICTION_MOST_PAGES:-}
      PREDICTION_MOST_OPEN: ${PREDICTION_MOST_OPEN:-}
      PREDICTION_MOST_CHECKS: ${PREDICTION_MOST_CHECKS:-}
      PREDICTION_DEPOSIT_MINT: ${PREDICTION_DEPOSIT_MINT:-}
      PREDICTION_LEAST_DEPOSIT: ${PREDICTION_LEAST_DEPOSIT:-}
      PREDICTION_MOST_DEPOSIT: ${PREDICTION_MOST_DEPOSIT:-}
      PREDICTION_NOTE: ${PREDICTION_NOTE:-}
    ports:
      - "${PREDICTION_BIND:-127.0.0.1}:${PREDICTION_PORT:-8094}:8092"
    networks: [egress]
    volumes:
      - prediction-data:/data
    read_only: true
    stop_grace_period: 20s
    stop_signal: SIGTERM
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  ctl:
    profiles: [operator]
    build:
      context: ../..
      dockerfile: examples/demo-prediction/Dockerfile
    image: ${PREDICTION_IMAGE:-seeker-prediction/prediction:local}
    entrypoint: ["/publishctl"]
    environment:
      PUBLISHER_API_URL: http://prediction:8092
      PUBLISHER_API_TOKEN: ${PUBLISHER_API_TOKEN:?set PUBLISHER_API_TOKEN in deploy/prediction/.env}
    networks: [egress]
    depends_on: [prediction]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  prediction-admin:
    profiles: [admin]
    build:
      context: ../..
      dockerfile: examples/demo-prediction/Dockerfile
    image: ${PREDICTION_IMAGE:-seeker-prediction/prediction:local}
    entrypoint: ["/prediction-admin"]
    restart: unless-stopped
    environment:
      ADMIN_LISTEN_ADDRESS: 0.0.0.0:8096
      ADMIN_PUBLIC_PATH: /
      ADMIN_API_URL: http://prediction:8092
      PUBLISHER_API_TOKEN: ${PUBLISHER_API_TOKEN:?set PUBLISHER_API_TOKEN in deploy/prediction/.env}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      ADMIN_PASSWORDS: ${ADMIN_PASSWORDS}
    ports:
      - "${PREDICTION_ADMIN_BIND:-127.0.0.1}:${PREDICTION_ADMIN_PORT:-8096}:8096"
    networks: [egress]
    depends_on: [prediction]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  egress:

volumes:
  prediction-data:
    name: ${PREDICTION_VOLUME_NAME:-seeker-prediction_prediction-data}
