name: seeker-direct-ingress

services:
  direct-ingress:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DIRECT_DOMAIN: ${DIRECT_DOMAIN:?set DIRECT_DOMAIN in deploy/ingress/direct/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/ingress/direct/.env}
    ports:
      - "${DIRECT_HTTP_BIND:-0.0.0.0:80}:80"
      - "${DIRECT_HTTPS_BIND:-0.0.0.0:443}:443"
    networks:
      - direct-ingress
      - public
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://mcp-server:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]

networks:
  direct-ingress:
    external: true
    name: ${DIRECT_INGRESS_NETWORK:-seeker-direct-ingress}
  public:

volumes:
  caddy-data:
    name: ${DIRECT_CADDY_DATA_VOLUME:-seeker-agent-wallet_gateway-data}
  caddy-config:
    name: ${DIRECT_CADDY_CONFIG_VOLUME:-seeker-agent-wallet_gateway-config}
