name: seeker-feed-ingress

services:
  feed-ingress:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      FEED_DOMAIN: ${FEED_DOMAIN:?set FEED_DOMAIN in deploy/ingress/feed/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/ingress/feed/.env}
    ports:
      - "${FEED_HTTP_BIND:-0.0.0.0:80}:80"
      - "${FEED_HTTPS_BIND:-0.0.0.0:443}:443"
    networks:
      - feed-ingress
      - public
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://feed-gateway:8090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]

networks:
  feed-ingress:
    external: true
    name: ${FEED_INGRESS_NETWORK:-seeker-feed-ingress}
  public:

volumes:
  caddy-data:
    name: ${FEED_CADDY_DATA_VOLUME:-seeker-broadcast_proxy-data}
  caddy-config:
    name: ${FEED_CADDY_CONFIG_VOLUME:-seeker-broadcast_proxy-config}
