# The SKR staking server on its own. It is a second, independent direct server: it shares no
# database, no token and no listener with the general MCP server, and the two can run side by side
# on one host because every name it reads is its own (SEE-146).
name: seeker-agent-connect-skr-staking

services:
  skr-staking-server:
    build:
      context: ../..
      dockerfile: skr-staking-server/Dockerfile
    image: ${SKR_STAKING_IMAGE:-seeker-agent-connect/skr-staking-server:local}
    restart: unless-stopped
    environment:
      SKR_STAKING_HOST: 0.0.0.0
      SKR_STAKING_PORT: 8090
      SKR_STAKING_PUBLIC_URL: ${SKR_STAKING_PUBLIC_URL:-http://127.0.0.1:8090}
      SKR_STAKING_DATA_DIR: /data
      SKR_STAKING_DATABASE_PATH: ${SKR_STAKING_DATABASE_PATH:-/data/skr-staking-server.db}
      SKR_STAKING_MCP_TOKEN: ${SKR_STAKING_MCP_TOKEN:?set SKR_STAKING_MCP_TOKEN in deploy/skr-staking/.env}
      SKR_STAKING_RPC_URL: ${SKR_STAKING_RPC_URL:?set SKR_STAKING_RPC_URL in deploy/skr-staking/.env}
      SKR_STAKING_RPC_TIMEOUT_MS: ${SKR_STAKING_RPC_TIMEOUT_MS:-}
      SKR_STAKING_REQUEST_TTL_SECONDS: ${SKR_STAKING_REQUEST_TTL_SECONDS:-}
      SKR_STAKING_PENDING_LIMIT: ${SKR_STAKING_PENDING_LIMIT:-}
      SKR_STAKING_PAIRING_TOKEN_TTL_SECONDS: ${SKR_STAKING_PAIRING_TOKEN_TTL_SECONDS:-}
      SKR_STAKING_ALLOWED_HOSTS: ${SKR_STAKING_ALLOWED_HOSTS:-}
      SKR_STAKING_GUARDIAN: ${SKR_STAKING_GUARDIAN:-}
    ports:
      - "${SKR_STAKING_SERVER_BIND:-127.0.0.1}:${SKR_STAKING_SERVER_PORT:-8090}:8090"
    networks:
      - direct-ingress
      - egress
    volumes:
      - skr-data:/data
    stop_grace_period: 30s
    stop_signal: SIGTERM
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  direct-ingress:
    name: ${DIRECT_INGRESS_NETWORK:-seeker-direct-ingress}
    internal: true
  egress:

volumes:
  skr-data:
    name: ${SKR_STAKING_VOLUME_NAME:-seeker-agent-connect-skr-staking_skr-data}
