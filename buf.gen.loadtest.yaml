version: v2
clean: true
# Go for the load harness (SEE-99, docs/development/load.md). A fourth template, because the
# harness speaks a fourth subset of the protocol — and the only one that spans two schemas.
#
# It is the one consumer in this repository that is both sides of a feed at once: it publishes
# synthetic proposals through the gateway's publisher API, reads them back over the client API, and
# listens to the broker's unidirectional stream for the same documents arriving. Measuring
# publish-to-receive latency means holding all three, so all three are generated here — and
# nowhere else, because nothing that ships is allowed to hold them together. The gateway never
# reads a feed (buf.gen.feed-gateway.yaml), a publisher template never reads one either
# (buf.gen.publisher.yaml), and the phone never publishes (buf.gen.yaml).
managed:
  enabled: true
  override:
    # The module path plus the proto directory, so an import reads
    # .../loadtest/internal/gen/seekervault/gateway/v1 — and, for the vendored broker schema,
    # .../loadtest/internal/gen/centrifugal/centrifugo/unistream.
    - file_option: go_package_prefix
      value: github.com/BrRenat/SeekerAgentWallet/loadtest/internal/gen
plugins:
  # Messages. The runtime library in loadtest/go.mod must match this version, and it is the version
  # feed-gateway/go.mod and publisher/go.mod pin: a harness that measured a different wire format from
  # the one the gateway speaks would be measuring itself (docs/development/toolchain.md).
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: loadtest/internal/gen
    opt: paths=source_relative
  # The Connect clients. Only clients are used: the harness serves none of these procedures, and
  # loadtest/internal/drive/boundary_test.go fails if it ever mounts one.
  - remote: buf.build/connectrpc/go:v1.21.0
    out: loadtest/internal/gen
    opt: paths=source_relative
inputs:
  # Our protocol: the publisher API a synthetic publisher writes through, the client API a
  # subscriber reads, and the stream envelope a listener decodes.
  - directory: proto
    paths:
      - proto/seekervault/gateway/v1
      - proto/seekervault/proposal/v1
      - proto/seekervault/request/v2
      - proto/seekervault/server/v1
  # The broker's own client schema, pinned and checksummed in third_party/centrifugo. The harness
  # listens on the transport a phone listens on, which means speaking this; `pnpm generate` checks
  # the digest before generating, so a harness is never built against an edited copy.
  - directory: third_party/centrifugo
