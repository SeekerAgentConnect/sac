# Render Blueprint: the sidecar and its gateway as one Docker web service, built by Render
# from this repository (https://render.com/docs/blueprint-spec).
#
# Render terminates HTTPS and forwards HTTP to Caddy inside the container, which forwards the
# public routes to the loopback-only sidecar. See deploy/render/README.md for what runs, the
# environment, pairing the phone, and the alternative of deploying a prebuilt image.
#
# Apply it from the dashboard: New > Blueprint > this repository. Render creates the service,
# generates the two tokens, and attaches the disk before the first start.
services:
  - type: web
    name: seeker-agent-connect
    runtime: docker
    # A disk needs a paid instance, and a service with a disk runs exactly one instance
    # (https://render.com/docs/disks). SQLite lives on that disk.
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    # The supervisor gives its children 25 seconds after SIGTERM; Render waits this long.
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: commit
    disk:
      name: sidecar-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # Two different random secrets, generated by Render and never committed. Both are
      # base64-encoded 256-bit values, longer than the sidecar's 32-character minimum.
      - key: MCP_TOKEN
        generateValue: true
      - key: PHONE_TOKEN
        generateValue: true
      # The pairing code's URL and the only Host /mcp accepts. Left unset, the supervisor uses
      # Render's own RENDER_EXTERNAL_URL (https://<service>.onrender.com). Set it to
      # https://your.domain when a custom domain is attached.
      - key: SIDECAR_PUBLIC_URL
        sync: false
      # Devnet for the first transfers. Remove the variable to serve no transfer tool at all.
      - key: SOLANA_RPC_URL
        value: https://api.devnet.solana.com
      - key: MCP_DEMO_TOOLS
        value: "false"
      - key: DATABASE_PATH
        value: /data/sidecar.db
