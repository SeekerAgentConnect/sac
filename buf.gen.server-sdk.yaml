version: v2
clean: true
# Direct wire contracts owned and packaged by @seeker-vault/server-sdk. Public-feed and publisher
# contracts are deliberately absent from this npm artifact.
plugins:
  - local: protoc-gen-es
    out: server-sdk/src/gen
    opt:
      - target=js+dts
      - import_extension=js
inputs:
  - directory: proto
    paths:
      - proto/seekervault/live/v1
      - proto/seekervault/request/v1
      - proto/seekervault/server/v1
      - proto/seekervault/update/v1
