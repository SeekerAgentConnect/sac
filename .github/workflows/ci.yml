name: CI

on:
  pull_request:
  push:
    branches: [master, develop]
  workflow_dispatch:

# CI only reads the repository. It never commits or pushes generated or formatted changes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Format, lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:hello
      # The Stage 2 acceptance scenario: two sidecar processes with throwaway databases.
      - run: pnpm test:queue
      # The Stage 4 transfer scenario, against a fake Solana JSON-RPC endpoint on loopback. Its one
      # live-network case is opt-in and stays off here: SEEKER_VAULT_NETWORK_CHECKS is not set, so
      # CI reaches no cluster and spends nothing (docs/testing/stage-4.md).
      - run: pnpm test:transfer
      # Build and inspect the exact npm artifact, then install it into a temporary project outside
      # the workspace. This never publishes and uses no npm credential.
      - run: pnpm test:server-sdk-package
      # Exercise the executable MCP tgz itself through local, global-style, and transient installs.
      # This includes pairing, MCP discovery, a protocol-phone result, restart persistence, and
      # duplicate-store refusal; it neither publishes nor uses npm credentials.
      - run: pnpm test:mcp-server-package
      - run: pnpm check:generated
      - run: pnpm build

  broadcast:
    # The broadcast gateway (SEE-90). Its own toolchain, its own job: the Node checks do not need
    # Go, and this one does not need pnpm's dependencies beyond the script that runs it.
    name: Broadcast gateway formatting, vet, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The one place the Go version is pinned: broadcast/go.mod's own requirement.
          go-version-file: broadcast/go.mod
          cache-dependency-path: broadcast/go.sum
      # The check itself is a Node script, so that the command CI runs and the command a
      # contributor runs are the same one. It needs no installed dependencies.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm check:broadcast

  publisher:
    # The publisher templates (SEE-95). Their own module and their own job, for the same reason the
    # gateway has one — and this job builds the gateway too, because the test that proves the two
    # agree runs the real binary (docs/development/publisher.md).
    name: Publisher templates formatting, vet, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # publisher/go.mod requires the same version broadcast/go.mod does; a test in the module
          # fails if the two modules' shared rules ever drift.
          go-version-file: publisher/go.mod
          cache-dependency-path: |
            publisher/go.sum
            broadcast/go.sum
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm check:publisher

  android:
    name: Android unit tests, lint, debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # The MIT-licensed provider; the default "enhanced" provider has separate terms of use.
          cache-provider: basic
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Includes verifyRoborazziDebug for both Android modules. CI never records over the
      # source-controlled baselines, so an unapproved rendering change fails this job.
      - run: pnpm check:android

  device:
    # The instrumentation UI test on an emulator, against the real sidecar over MCP. An emulator run
    # never counts as the physical Seeker check (docs/testing/stage-1.md).
    name: Round trip on an emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # No Gradle cache in this job: restoring the Android job's (about 900 MB) leaves less free
          # disk than the emulator's data partition needs (7.2 GB), and the emulator never boots.
          cache-disabled: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: pnpm test:hello --device
