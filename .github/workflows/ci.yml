name: CI

# Every pull request and every push to the main branches. A pull request from a fork gets a
# read-only token and no secrets, and this workflow asks for neither: it builds, tests and audits
# exactly what a release would publish, and publishes nothing (scripts/check-release.mjs holds it
# to that). Publication is .github/workflows/release.yml alone.
on:
  pull_request:
  push:
    branches: [master, develop]
  workflow_dispatch:

# CI only reads the repository. It never commits or pushes generated or formatted changes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Format, lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:deployments
      # The release manifest, the npm manifests, the in-source version constants and the two
      # workflows have to agree before anything is built. It reads files only: no registry, no
      # credential, nothing published (SEE-168).
      - run: pnpm check:release
      - run: pnpm check
      - run: pnpm test:hello
      # The Stage 2 acceptance scenario: two sidecar processes with throwaway databases.
      - run: pnpm test:queue
      # The Stage 4 transfer scenario, against a fake Solana JSON-RPC endpoint on loopback. Its one
      # live-network case is opt-in and stays off here: SEEKER_VAULT_NETWORK_CHECKS is not set, so
      # CI reaches no cluster and spends nothing (docs/testing/stage-4.md).
      - run: pnpm test:transfer
      # Build and inspect the exact npm artifact, then install it into a temporary project outside
      # the workspace. This never publishes and uses no npm credential.
      - run: pnpm test:server-sdk-package
      # Exercise the executable MCP tgz itself through local, global-style, and transient installs.
      # This includes pairing, MCP discovery, a protocol-phone result, restart persistence, and
      # duplicate-store refusal; it neither publishes nor uses npm credentials.
      - run: pnpm test:mcp-server-package
      # The staking server's own tarball, exercised the same way against a stub mainnet
      # endpoint: pairing, MCP discovery and a read-only status round trip, with no cluster.
      - run: pnpm test:skr-staking-package
      - run: pnpm check:generated
      - run: pnpm build

  gateway:
    # The feed gateway (SEE-90), services/gateway. Its own toolchain, its own job: the Node checks do not need
    # Go, and this one does not need pnpm's dependencies beyond the script that runs it.
    name: Feed gateway formatting, vet, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The one place the Go version is pinned: services/gateway/go.mod's own requirement.
          go-version-file: services/gateway/go.mod
          cache-dependency-path: services/gateway/go.sum
      # The check itself is a Node script, so that the command CI runs and the command a
      # contributor runs are the same one. It needs no installed dependencies.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm check:gateway

  publisher-support:
    # The library both public-feed demos are built on (SEE-134). Its own module and its own job, for
    # the same reason the gateway has one — and this job builds the gateway too, because the test
    # that proves a publisher and the gateway agree runs the real binary
    # (docs/development/demos.md).
    name: Publisher support formatting, vet, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # packages/publisher-support/go.mod requires the same version services/gateway/go.mod does; a test in
          # the library fails if the two modules' shared rules ever drift.
          go-version-file: packages/publisher-support/go.mod
          cache-dependency-path: |
            packages/publisher-support/go.sum
            services/gateway/go.sum
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm check:publisher-support

  demo-signals:
    # The CopyTrading signals demo (SEE-95, SEE-134), examples/demo-signals. A job of its own rather than a step in another,
    # because "each demo builds and runs without the other" is a claim, and a job that checks out
    # the repository and builds exactly one demo is what tests it. It does not build
    # demo-prediction, and nothing here would notice if that module were absent.
    name: CopyTrading demo formatting, vet, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: examples/demo-signals/go.mod
          cache-dependency-path: |
            examples/demo-signals/go.sum
            packages/publisher-support/go.sum
            services/gateway/go.sum
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm check:demo-signals
      # The image, built the way its guide says to build it. It proves the documented command works
      # and that the build needs no sibling demo: examples/demo-prediction/ is never copied into the context.
      - run: docker build -f examples/demo-signals/Dockerfile -t demo-signals:ci .

  demo-prediction:
    # The Prediction demo (SEE-96, SEE-134), examples/demo-prediction. The same argument, the other
    # way round: this job never builds examples/demo-signals, and its image contains no signal-writing API and no trader UI.
    name: Prediction demo formatting, vet, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: examples/demo-prediction/go.mod
          cache-dependency-path: |
            examples/demo-prediction/go.sum
            packages/publisher-support/go.sum
            services/gateway/go.sum
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm check:demo-prediction
      - run: docker build -f examples/demo-prediction/Dockerfile -t demo-prediction:ci .

  images:
    # Every published image, built for both release platforms the way the release workflow builds
    # it — and never pushed. The list is release/components.json's, so a new image component is
    # covered without editing this file (SEE-182).
    name: Image ${{ matrix.component.id }} (amd64, arm64)
    needs: image-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.image-matrix.outputs.components) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.dockerfile }}
          target: ${{ matrix.component.target }}
          platforms: ${{ matrix.component.platforms }}
          push: false
          build-args: |
            VERSION=${{ matrix.component.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=ci-${{ matrix.component.id }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.component.id }}

  image-matrix:
    name: Image components
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      components: ${{ steps.list.outputs.components }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: |
          node -e '
            const { components } = require("./release/components.json");
            const images = components.filter((c) => c.image).map((c) => ({
              id: c.id, version: c.version, dockerfile: c.image.dockerfile,
              context: c.image.context ?? ".", target: c.image.target ?? "",
              platforms: c.image.platforms.join(","),
            }));
            console.log(`components=${JSON.stringify(images)}`);
          ' >> "$GITHUB_OUTPUT"

  android:
    name: Android unit tests, lint, debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # The MIT-licensed provider; the default "enhanced" provider has separate terms of use.
          cache-provider: basic
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The workspace consumes the SDK through its published entry point, packages/server-sdk/dist,
      # which no install creates: the real sidecars these tests start import it.
      - run: pnpm build:server-sdk
      # Includes verifyRoborazziDebug for both Android modules. CI never records over the
      # source-controlled baselines, so an unapproved rendering change fails this job.
      - run: pnpm check:android
      # The SAC swap fee build configuration (SEE-173): default off, fee builds from properties
      # and from environment variables, and every malformed setting refused at configuration time.
      - run: pnpm check:swap-fee-build
      # The unsigned release candidate, as the release workflow builds it with no configuration:
      # the application id, versionName and versionCode must be release/components.json's. No
      # signing key exists here, and the check says so (SEE-182).
      - run: apps/android/gradlew -p apps/android :app:assembleRelease
      - run: bash scripts/check-android-apk.sh apps/android/app/build/outputs/apk/release/app-release-unsigned.apk

  device:
    # The instrumentation UI test on an emulator, against the real sidecar over MCP. An emulator run
    # never counts as the physical Seeker check (docs/testing/stage-1.md).
    name: Round trip on an emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # No Gradle cache in this job: restoring the Android job's (about 900 MB) leaves less free
          # disk than the emulator's data partition needs (7.2 GB), and the emulator never boots.
          cache-disabled: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The workspace consumes the SDK through its published entry point, packages/server-sdk/dist,
      # which no install creates: the real sidecars these tests start import it.
      - run: pnpm build:server-sdk
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: pnpm test:hello --device
      # The emulator run prints only that a test failed; the report says which one and why.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-device-test-report
          path: apps/android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
