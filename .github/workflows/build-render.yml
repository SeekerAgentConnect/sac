name: Render image

# Builds the Render deployment image (deploy/render/Dockerfile) for linux/amd64, the architecture
# Render runs, and pushes it to this repository's GitHub Container Registry as
# ghcr.io/<owner>/seeker-agent-connect. Render's "Existing Image" deployment pulls it from there
# (deploy/render/README.md). A Blueprint deployment builds from the repository instead and does
# not need this workflow.
#
# Runs only when started by hand from the Actions tab, so it spends no Actions minutes on its
# own; the tag-push trigger was removed on purpose. Nothing here reads a secret of the
# deployment: the image carries no token, and GITHUB_TOKEN only pushes the package.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: render-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and push linux/amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/seeker-agent-connect
          # The branch or tag the run was started from, and the commit.
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/render/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
