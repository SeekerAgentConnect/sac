name: seeker-agent-connect-mcp

services:
  mcp-server:
    build:
      context: ..
      dockerfile: mcp-server/Dockerfile
    image: seeker-agent-connect/mcp-server:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The container binds all of its own interfaces. Host publication stays loopback below.
      SIDECAR_HOST: 0.0.0.0
      SIDECAR_PORT: 8080
      MCP_SERVER_DATA_DIR: /data
      DATABASE_PATH: /data/sidecar.db
    ports:
      - "${MCP_SERVER_BIND:-127.0.0.1}:${MCP_SERVER_PORT:-8080}:8080"
    volumes:
      - mcp-data:/data
    stop_grace_period: 30s
    stop_signal: SIGTERM
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  mcp-data:
