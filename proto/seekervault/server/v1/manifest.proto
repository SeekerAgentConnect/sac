syntax = "proto3";

// What a server says about itself (SEE-88, docs/wiki/server-manifests.md). Stage 7.1 has two
// kinds of server: the owner's own private sidecar, which one paired phone calls directly, and a
// developer's publisher, which broadcasts proposals to everyone subscribed through the shared
// gateway. A manifest is how the phone learns which one it is talking to, what contract that
// server speaks, and which bundled client plugins it needs, without guessing any of it.
//
// It is a separate package from seekervault.request.v1 on purpose: the durable request workflow
// is the private phone-sidecar contract, while a manifest is published by every kind of server,
// including the Go gateway (SEE-90) and the publisher templates (SEE-95, SEE-96), which speak no
// MCP and serve no RequestService.
//
// A manifest is bounded declarative data and nothing else. There is no field here that installs
// code, asks for a permission, carries a policy, or names a wallet endpoint, and there is no
// field that could grow into one: what the phone will do with a server is decided by the build it
// is running and by the owner, never by the document.
package seekervault.server.v1;

// ServerManifest is one server's current, complete statement about itself. Everything the phone
// needs to decide whether it supports the server is here; a field it doesn't understand is an
// unknown field, and a manifest that leaves a required one out is refused rather than patched.
message ServerManifest {
  // The server's lasting ID (a lowercase UUID): the one in its pairing code for a direct sidecar,
  // and the publisher's own for a feed. The phone refuses a manifest whose ID isn't the one it
  // already trusts for that connection, so a manifest can never move a connection to another
  // server.
  string server_id = 1;
  // Which phone-server contract this server speaks. Version 1 is Stage 7.1: seekervault.request.v1
  // for a direct server, and the gateway's feed contract for a publisher. Zero is never
  // published, and a version the phone doesn't speak is reported as unsupported rather than
  // treated as the nearest one it knows.
  uint32 protocol_version = 2;
  // A revision that changes whenever anything else in this manifest does, and never goes
  // backwards. The phone caches a manifest by identity and revision: an unchanged revision means
  // it may keep what it has, and a higher one means it must read the manifest again. It counts
  // settings changes, not time, and it is not a version of the server's software.
  uint64 settings_revision = 3;
  // How the phone reaches this server. It selects the reference at the end of this message, and
  // the two must agree: a manifest whose mode and reference disagree says nothing the phone can
  // act on.
  ConnectionMode mode = 4;
  // The bundled client plugins this server's operations need (SEE-86). The phone matches them
  // against the plugins compiled into the build it is running: one it doesn't carry is reported as
  // missing, and one written against a contract outside the range given here is reported as
  // incompatible. Neither is ever downloaded, and neither is a reason to sign anything blind.
  // Empty means the server needs none, which is what the sidecar's own actions are.
  repeated PluginRequirement required_plugins = 5;
  // The environments this server serves (SEE-97). The phone refuses to treat a server as
  // supported in an environment the server doesn't name, because sandbox and production are
  // different promises about what happens when the owner approves. At most one of each.
  repeated ServerEnvironment environments = 6;
  // The name the server calls itself, for the connection's default label. Optional; at most 64
  // UTF-8 bytes of printable text. It is the server's own claim and is never verified: the owner
  // can rename any connection, and their name is the one the app shows.
  string display_name = 7;
  // The reference comes last, after every ordinary field, because where a oneof's bytes go in a
  // serialized message is not settled by the protobuf spec: runtimes write one in field-number
  // order, others after the fields around it. Last is the one position every runtime agrees on,
  // which is what lets the cross-runtime fixtures compare bytes at all
  // (proto/fixtures/seekervault/server/v1/).
  oneof reference {
    // Set when mode is CONNECTION_MODE_DIRECT.
    DirectServer direct = 8;
    // Set when mode is CONNECTION_MODE_GATEWAY_FEED.
    GatewayFeed feed = 9;
  }
}

// Which transport a connection uses. It is stored per connection: one phone can hold a direct
// connection to its own sidecar and several gateway feeds at the same time, and neither affects
// the other.
enum ConnectionMode {
  // Never published. A manifest without an explicit mode is refused: the phone does not guess a
  // mode, and in particular never reads a missing one as a feed.
  CONNECTION_MODE_UNSPECIFIED = 0;
  // The phone calls this server itself, with the credential it holds from pairing. This is the
  // existing private workflow, and a server that publishes no manifest at all is this by
  // definition (docs/wiki/server-manifests.md#legacy-direct).
  CONNECTION_MODE_DIRECT = 1;
  // The phone reads this server's proposals from the shared gateway, and never calls the server
  // itself. It holds no credential for it, and the server learns nothing about the phone.
  CONNECTION_MODE_GATEWAY_FEED = 2;
}

// Which promise a server keeps when the owner approves (SEE-97).
enum ServerEnvironment {
  SERVER_ENVIRONMENT_UNSPECIFIED = 0;
  // Real operations on the network the owner's wallet is selected for.
  SERVER_ENVIRONMENT_PRODUCTION = 1;
  // Live public market data where it exists, and execution that is clearly simulated.
  SERVER_ENVIRONMENT_SANDBOX = 2;
}

// DirectServer is where a direct server is reached. The phone accepts it only when it is the
// origin it paired with: this field confirms a URL, and can never change one.
message DirectServer {
  // The server's absolute URL, in the same form as its pairing code's: HTTPS, with no user info,
  // query, or fragment. Loopback HTTP is accepted only where the platform permits cleartext to
  // that host, which is development builds.
  string url = 1;
}

// GatewayFeed is where a publisher's proposals are read. The publisher's own address is
// deliberately absent: the phone resolves a feed through the gateway and never contacts the
// developer's server, so there is nothing here for it to contact.
message GatewayFeed {
  // The shared gateway's absolute HTTPS origin, with no path, query, user info, or fragment.
  string gateway_url = 1;
  // The channel this server publishes on. A publisher may name only its own: the channel is
  // "server/<server_id>" for the server_id above, so a manifest cannot claim another publisher's
  // audience, and the gateway enforces the same rule when it accepts a publication (SEE-90).
  string channel = 2;
}

// PluginRequirement is one bundled plugin a server's operations need, named by the stable ID the
// plugin declares (PluginDescriptor.id), such as "jupiter.swap".
message PluginRequirement {
  // Lowercase dot-separated segments, at most 128 bytes, with at least one dot. It is a name and
  // nothing else: never a URL, a package, or anything loadable.
  string plugin_id = 1;
  // The inclusive range of plugin-boundary contract versions this server works with
  // (PLUGIN_CONTRACT). A plugin in the build whose contract falls outside it is reported as
  // incompatible rather than called through a contract neither side agreed on. min_contract must
  // be at least 1 and at most max_contract.
  uint32 min_contract = 2;
  uint32 max_contract = 3;
}
