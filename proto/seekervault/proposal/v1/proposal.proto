syntax = "proto3";

// What a publisher broadcasts (SEE-89, docs/wiki/shared-proposals.md). Stage 7.1's second kind of
// server is a developer's publisher: it proposes an operation once, on its own channel, and
// everyone subscribed through the shared gateway receives the same document. It is not a request
// addressed to one phone, and it is not the private ActionRequest of seekervault.request.v1 with
// more subscribers — the two are different things, and this package exists so neither is bent into
// the other.
//
// A proposal is common intent. It says what is being proposed and until when; it says nothing about
// any subscriber, because the publisher has no subscriber to say anything about. What each owner
// picks, what their phone prepares, whether they went ahead, and what came of it are theirs alone:
// they stay on the device that decided them and are never published back
// (docs/security.md#a-proposal-is-common-and-a-decision-is-not).
//
// Its own package, like seekervault.server.v1 and for the same reason: a proposal is published by
// the Go templates (SEE-95, SEE-96) through the gateway (SEE-90), and none of them serves a
// RequestService or speaks MCP.
//
// There is no version field here. Which contract a publisher speaks is stated once, in its
// ServerManifest, and a phone cannot hold a feed at all without having validated that manifest
// first — so a second version on this document would be a second place for one fact to be wrong.
// What is versioned per document is its revision, below.
package seekervault.proposal.v1;

import "google/protobuf/timestamp.proto";

// Proposal is one publisher's current statement of one thing it proposes. Everything in it is the
// publisher's own, and every subscriber receives it identically: it is the shared half of the
// stage, and the whole of the shared half.
message Proposal {
  // The publisher's lasting ID (a lowercase UUID), which is the identity in its own manifest. A
  // phone refuses a proposal whose ID isn't the one it already reads that feed for, so one
  // publisher can never put a proposal into another's feed.
  string server_id = 1;
  // The channel it was published on, which is "server/<server_id>" and nothing else. A publisher
  // owns one channel, the gateway enforces that when it accepts a publication (SEE-90), and the
  // phone checks it again: a document that names another channel is claiming another publisher's
  // audience.
  string channel = 2;
  // The publisher's own ID for this proposal (a lowercase UUID), stable for as long as the
  // proposal exists. Everything a device keeps about a proposal is keyed by the three identity
  // fields above, so the same document delivered twice — replayed, pushed again, or read back in a
  // snapshot — is recognized as the one thing it is.
  string proposal_id = 3;
  // A revision that changes whenever anything else in this document does, and never goes
  // backwards. It is the publisher's promise about the content: a repeat means nothing changed, a
  // higher one means the terms moved and anything a device decided about the older terms no longer
  // describes these, and a lower one is refused. Zero is never published.
  uint64 revision = 4;
  // What is proposed, named at the protocol's own level (docs/protocol.md#actions): "swap", not
  // the provider that serves it. A device matches it against the plugins compiled into the build
  // it is running (SEE-86), and one nothing serves is shown and never executed.
  string operation = 5;
  // The bundled client plugin this proposal was written for, by the stable ID the plugin declares
  // ("jupiter.swap"). It is a name and nothing loadable, and it is checked rather than followed: a
  // device that resolves a different plugin for the operation refuses the proposal instead of
  // handing the document to whatever it has.
  string plugin_id = 6;
  // Whether the publisher still stands behind it. A withdrawn proposal can still be read — a
  // device that acted on it has a record either way — but nothing new is executed from one.
  ProposalStatus status = 7;
  // When the publisher first published it, by the publisher's clock.
  google.protobuf.Timestamp created_at = 8;
  // When it last changed, by the same clock; created_at until it does. It is not the revision:
  // ordering is the revision's job, and a clock that disagrees with another publisher's cannot
  // change what a device already validated.
  google.protobuf.Timestamp updated_at = 9;
  // The instant after which nothing is executed from it, absolute and not a duration: a device
  // that was offline for a day must reach the same conclusion as one that was not. It is
  // required, so a proposal cannot be open for ever by saying nothing.
  google.protobuf.Timestamp expires_at = 10;
  // The publisher's own description, for a person to read. It is unverified prose, shown apart
  // from everything a device established for itself, exactly as an agent's note is
  // (ActionRequest.agent_note). Optional; at most 1024 UTF-8 bytes.
  string publisher_note = 11;
  // The operation's common terms, as a short list of named text values: what is proposed, on what
  // market, at what published price — whatever the operation is about that is the same for
  // everyone who received it. The plugin that serves the operation reads the keys it knows and
  // ignores the rest, the way it reads bytes it prepared: core carries this and never interprets
  // it.
  //
  // What may not be in here is the point. There is nothing about a subscriber: not an address they
  // would pay from, not a quantity they chose, not anything prepared for them to sign. A
  // publisher has no subscriber to describe — it never learns that a given phone received this —
  // and a device's own choice is collected on that device, kept there, and never published back
  // (docs/wiki/shared-proposals.md).
  //
  // Bounded on every axis: at most 32 values, each key a short lowercase name unique in the list,
  // each text at most 512 UTF-8 bytes. A list that breaks any of those is refused whole rather
  // than trimmed to fit.
  repeated ProposalValue values = 12;
}

// Whether a publisher still stands behind a proposal.
enum ProposalStatus {
  // Never published. A proposal with no explicit status is refused: a device does not read a
  // missing one as open.
  PROPOSAL_STATUS_UNSPECIFIED = 0;
  // The publisher stands behind it, and it may be executed until expires_at.
  PROPOSAL_STATUS_OPEN = 1;
  // The publisher withdrew it. It is still readable, and nothing new is executed from it. A
  // device that already executed keeps its own record: what happened happened, and a publisher
  // cannot unsay it.
  PROPOSAL_STATUS_CANCELLED = 2;
}

// ProposalValue is one of the operation's common terms.
message ProposalValue {
  // A short lowercase name, dot- or underscore-separated, at most 64 bytes, unique within the
  // list: it is how the plugin finds the term it is looking for.
  string key = 1;
  // The term itself, as text, at most 512 UTF-8 bytes. Text rather than a typed union because
  // core does not interpret it: the plugin that knows what "price" means for its operation is the
  // one that reads it, exactly as it is the one that reads the bytes it prepared. A quantity is
  // written in the asset's own base units, as the rest of this protocol writes one
  // (TransferAction.amount).
  string text = 2;
}
