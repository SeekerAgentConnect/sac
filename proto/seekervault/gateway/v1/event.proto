syntax = "proto3";

// What arrives on a feed's stream (SEE-91, docs/wiki/feed-gateway.md#the-stream).
//
// The gateway holds the documents and answers reads (feed.proto); this file is the other half of
// the same story — what a subscriber is told when one of those documents changes, so that a phone
// being looked at does not have to poll to find out.
//
// The envelope is ours rather than the broker's. A publication could have carried the document
// alone, with the broker's own metadata saying what kind it was; it does not, because that
// metadata is not part of any contract either side can validate, and a subscriber that had to
// guess whether bytes were a manifest or a proposal would be parsing twice and trusting either
// answer. So one message describes every event, the phone parses one type, and what it finds
// inside goes through the same validators a read goes through (SEE-88, SEE-89) — the stream is a
// faster way to learn something, never a more trusted one.
//
// **Nothing about a subscriber may ever appear in this file**, for the reason feed.proto gives: a
// broadcast is the same for everyone who receives it, so there is nothing here that could be
// about one of them.
package seekervault.gateway.v1;

import "seekervault/proposal/v1/proposal.proto";
import "seekervault/request/v2/request.proto";
import "seekervault/server/v1/manifest.proto";

// FeedEvent is one publication on a channel: a document the gateway accepted, as it stood when the
// event was sent.
//
// It is not a patch and not a notification to go and ask: the document is here, complete, rebuilt
// by the gateway from the fields it validated. A subscriber that receives two events for the same
// document keeps the one with the higher revision and ignores the other — which is what makes
// at-least-once delivery harmless (SEE-90) and what makes the order events arrive in something
// nobody has to guarantee.
message FeedEvent {
  // The channel's sequence when this publication was accepted: the gateway's own count, which
  // never goes backwards. It is what lets a phone joining a stream tell whether a snapshot it is
  // walking already includes an event it is holding (ListProposalsResponse.snapshot_sequence), and
  // it is deliberately not the broker's cursor: that one is about the transport's history and is
  // used only to ask for what was missed. The two numbers are never compared with each other.
  uint64 sequence = 1;

  // Exactly one of these is set. An event of a kind a client does not know is not an error and not
  // something to drop quietly either: the client ignores the document it cannot read and refreshes
  // by snapshot, because an event it did not understand still means something changed.
  oneof document {
    // The publisher's settings changed: a new settings revision, the whole manifest.
    seekervault.server.v1.ServerManifest manifest = 2;
    // A proposal was published, republished at a higher revision, or withdrawn. A withdrawal is
    // the document with its status closed, not an absence — a phone that acted on a proposal keeps
    // its record of it for ever and has to be told what happened, not left to infer it (SEE-89).
    seekervault.proposal.v1.Proposal proposal = 3;
    // The common document. Protocol-1 proposal events remain readable during migration; a
    // protocol-2 publisher emits this form and all clients apply it through the same revision gate.
    seekervault.request.v2.Request request = 4;
  }
}
