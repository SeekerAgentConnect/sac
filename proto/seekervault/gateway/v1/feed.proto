syntax = "proto3";

// What a phone reads from the broadcast gateway (SEE-90, docs/wiki/broadcast-gateway.md).
//
// This is the whole of the client API, and nothing on it changes a document. A phone asks what a
// publisher says about itself, what it is currently proposing, what one of those proposals says,
// for permission to listen to a channel it already knows about (SEE-91), and where hints about one
// arrive (SEE-92). There is nothing here to write, because a subscriber has nothing to tell the
// gateway. The publisher's own
// server is never contacted by a phone, and never learns that a phone read anything
// (docs/security.md).
//
// The publisher API is a separate service on a separate listener (publish.proto). That separation
// is deployed, not just declared: a read port serves these five methods and no handler that could
// change anything, so no routing mistake can turn a read endpoint into a write one.
//
// **Nothing about a subscriber may ever appear in this file.** There is no field for a wallet, a
// quantity someone chose, a decision they made, or anything they signed, and a Go boundary test
// reads this proto and fails if the field set changes or a forbidden word appears in it — so a
// field that could carry any of it has to be argued for in that test first.
package seekervault.gateway.v1;

import "seekervault/proposal/v1/proposal.proto";
import "seekervault/server/v1/manifest.proto";

// FeedService is the read-only client API. It is unauthenticated on purpose: a feed is a
// broadcast, its reference can be printed in a README, and holding one grants nothing. What the
// gateway learns from a read is which channel someone is interested in, which is the minimum a
// subscription can be made of.
service FeedService {
  // The manifest the publisher registered: what contract it speaks, which client plugins its
  // operations need, which environments it serves, and the channel it publishes on. The phone
  // validates all of it against the reference it added the feed from before storing any of it
  // (SEE-88), so this method is asked, never believed.
  rpc GetServerManifest(GetServerManifestRequest) returns (GetServerManifestResponse);
  // A page of the channel's current proposals. Every proposal the publisher has open, and the ones
  // it has cancelled or let expire while the gateway still keeps them, are here: expiry and
  // cancellation are facts inside a document rather than reasons to hide it.
  rpc ListProposals(ListProposalsRequest) returns (ListProposalsResponse);
  // One proposal, for a phone that learned its ID some other way — a notification, or a page it
  // read before the document moved.
  rpc GetProposal(GetProposalRequest) returns (GetProposalResponse);
  // Permission to listen to channels this gateway serves (SEE-91).
  //
  // It exists because of what the stream transport is: a unidirectional stream, on which a client
  // cannot ask for anything after it connects — not a subscription, not history, not a refresh. Its
  // channels are fixed when the connection is made, by the credential it is made with. So the
  // gateway grants them: the caller names the channels it already holds feed references for, and
  // the answer is a short-lived ticket that admits a listener to exactly the ones this gateway
  // hosts.
  //
  // The ticket says which channels and nothing about who. There is no account behind it, no device
  // identifier in it, and no record of it kept here — it is minted in the answer and never written
  // down, so this method changes nothing and the gateway still knows nothing about its subscribers
  // (docs/security.md). It is a scoped, expiring grant rather than a secret: what it admits a
  // listener to is a broadcast that every other subscriber to the same channel is receiving too.
  rpc GetStreamTicket(GetStreamTicketRequest) returns (GetStreamTicketResponse);
  // Where this gateway's relay sends a hint that a channel changed (SEE-92).
  //
  // It exists because the name has to be the same on both sides, and neither side may guess it: the
  // relay derives a topic from the channel in a committed publication, and the phone has to
  // subscribe to exactly that. A name derived twice, in two languages, is a mismatch that shows up
  // as silence rather than as an error — so it is derived once, here, and stated.
  //
  // It is separate from GetStreamTicket on purpose. A deployment may relay without streaming, or
  // stream without relaying, and a phone asking about one must not be answered about the other.
  // Like a ticket, the answer is about channels and never about the caller: a topic is public,
  // holding its name grants nothing, and subscribing to it says nothing to this gateway — Firebase
  // owns topic membership, and the gateway is not told who joined (docs/security.md).
  rpc GetFeedTopics(GetFeedTopicsRequest) returns (GetFeedTopicsResponse);
}

message GetServerManifestRequest {
  // The publisher's lasting ID, which is what a feed reference carries.
  string server_id = 1;
  // The settings revision the caller already holds, or zero. The gateway answers `unchanged`
  // rather than re-sending a document the caller has, which is the same rule the phone's own cache
  // is built on: an unchanged revision means it may keep what it has (SEE-88). It is in the
  // request rather than in an HTTP header because the revision is the contract's own, and a
  // caching proxy in between must not be the thing that decides what a phone believes.
  uint64 known_settings_revision = 2;
}

message GetServerManifestResponse {
  // Absent when `unchanged` is set, and complete otherwise: the gateway does not serve a patch.
  seekervault.server.v1.ServerManifest manifest = 1;
  // The caller's revision is the current one, and the manifest was not sent.
  bool unchanged = 2;
  // The revision the gateway holds, set either way, so a caller that asked with the wrong number
  // still learns which one is current.
  uint64 settings_revision = 3;
}

message ListProposalsRequest {
  // The channel to read, which is "server/<server_id>" and the only channel that publisher owns.
  // A phone has it from its own feed reference and never has to be told it.
  string channel = 1;
  // How many proposals at most, 1 to 200. Zero means the gateway's own default.
  uint32 page_size = 2;
  // The token from a previous response, echoed exactly. Absent starts a new walk. A token is
  // opaque: it is this gateway's own note to itself about where the walk was, and a client that
  // builds one instead of echoing it is refused.
  string page_token = 3;
  // The snapshot sequence the caller already holds, or zero, and only on the first page. When the
  // channel has not moved since, the gateway answers `unchanged` with no proposals — one round
  // trip for a phone that is up to date, on the connection of someone paying for it by the
  // megabyte.
  uint64 known_snapshot_sequence = 4;
}

message ListProposalsResponse {
  // This page of proposals, ordered by proposal ID so the walk is stable while the feed moves.
  repeated seekervault.proposal.v1.Proposal proposals = 1;
  // Set when there is more to read, and absent on the last page.
  string next_page_token = 2;
  // The channel's sequence when this walk began: the gateway's count of accepted publications on
  // it, which never goes backwards. It is the walk's **consistency boundary**, and the documented
  // one: a completed walk holds every proposal that existed at this sequence and still exists at
  // the end, possibly at a newer revision than it had then, plus any that were published during
  // it. It is not a transaction. Nothing is lost by that, because every document carries its own
  // revision and the phone applies one only over an older one (SEE-89) — so a page set from mixed
  // moments converges, and a live stream's events (SEE-91) can be buffered during a walk and
  // applied after it.
  uint64 snapshot_sequence = 3;
  // The caller's sequence is the current one, and no proposals were sent. Only ever set for a
  // first page.
  bool unchanged = 4;
}

message GetProposalRequest {
  string channel = 1;
  string proposal_id = 2;
}

message GetProposalResponse {
  seekervault.proposal.v1.Proposal proposal = 1;
}

message GetStreamTicketRequest {
  // The channels to listen to, each "server/<server_id>" and each one the caller holds a feed
  // reference for. Asking for none is refused; asking for more than the gateway grants at once is
  // refused with how many it allows, because a bound nobody can see is a bound nobody can respect.
  repeated string channels = 1;
}

message GetStreamTicketResponse {
  // The credential a listener connects with, opaque to the caller. What it is made of is the
  // stream's business (docs/wiki/broadcast-gateway.md#the-stream); what a caller needs to know is
  // that it grants the channels below, expires, and can be asked for again.
  string ticket = 1;
  // The channels granted, one entry per channel the gateway hosts, in the order they were asked
  // for. A channel this gateway does not serve is **absent rather than fatal**: a phone holding one
  // stale feed reference keeps the stream for its others, and learns which one was not granted by
  // comparing what it asked with what it got. A malformed channel is refused outright, because that
  // is a caller's mistake rather than a fact about the gateway.
  repeated StreamChannel channels = 2;
  // How long the ticket is good for. A duration rather than an instant, so a phone whose clock
  // disagrees with the gateway's still renews at the right time — and renewing is ordinary: the
  // stream ends when the ticket expires, and the listener asks for another.
  uint32 lifetime_seconds = 3;
}

// StreamChannel maps a channel a caller knows to the name the same documents arrive under on the
// stream.
//
// The two are not the same string on purpose. `channel` is the protocol's: "server/<server_id>",
// the one a publisher's documents carry and the phone validates (SEE-88). `stream_channel` is the
// transport's, and it is opaque — it exists so the broker's own namespaces can scope history,
// recovery and permissions to these channels and nothing else, without the protocol having to know
// that the broker has namespaces at all.
message StreamChannel {
  string channel = 1;
  string stream_channel = 2;
}

message GetFeedTopicsRequest {
  // The channels to ask about, each "server/<server_id>" and each one the caller holds a feed
  // reference for. The same bounds as a ticket's: none is refused, and more than the gateway
  // answers at once is refused with the bound.
  repeated string channels = 1;
}

message GetFeedTopicsResponse {
  // One entry per channel this gateway both hosts and relays, in the order they were asked for. A
  // channel that is well formed but not hosted here is **absent rather than fatal**, exactly as it
  // is in a grant: a phone holding one stale feed reference keeps the hints for its others.
  repeated FeedTopic topics = 1;
}

// FeedTopic maps a channel a caller knows to the topic this deployment's relay sends that channel's
// hints on.
//
// `topic` is opaque and public. It is not a credential, not proof of access and not a secret: what
// arrives on it is a hint that something on the channel changed, with no document in it at all, and
// the documents are read over the methods above. A client that subscribes to a topic for a feed it
// does not hold learns nothing it could not learn by reading the feed (docs/security.md).
message FeedTopic {
  string channel = 1;
  string topic = 2;
}
